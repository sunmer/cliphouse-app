name: Deploy cliphou.se

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firebase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sunmer/cliphouse
          path: .agent-skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:sharing
      - run: npm run test:agent
        env:
          CLIPHOUSE_SKILL_DIR: .agent-skill
      - run: npm run test:benchmark
      - run: npx tsc -p tsconfig.server.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
      - run: npm run build
        env:
          BASE: /
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID }}
          VITE_SHARE_API_ORIGIN: ${{ vars.VITE_SHARE_API_ORIGIN }}
      - run: npm run test:benchmark-build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:video-policy
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/879081005056/locations/global/workloadIdentityPools/github/providers/github
          service_account: cliphouse-deploy@cliphouse-app.iam.gserviceaccount.com
      - name: Deploy share service
        if: ${{ vars.VITE_SHARE_API_ORIGIN != '' }}
        run: >-
          gcloud run deploy cliphouse-share --source . --project cliphouse-app
          --region europe-west1 --service-account cliphouse-share@cliphouse-app.iam.gserviceaccount.com
          --allow-unauthenticated --cpu 2 --memory 2Gi --concurrency 8
          --min-instances 1 --max-instances 2 --timeout 300 --cpu-boost
          --set-env-vars GOOGLE_CLOUD_PROJECT=cliphouse-app,SHARE_BUCKET=cliphouse-app-shares,PUBLIC_ORIGIN=https://cliphou.se,RENDER_VERSION=${{ github.sha }}${{ vars.LOOP_WORKER_URL != '' && format(',LOOP_WORKER_URL={0}', vars.LOOP_WORKER_URL) || '' }}
          ${{ vars.EDGE_SECRET_ENABLED == 'true' && '--set-secrets EDGE_SECRET=cliphouse-edge-secret:latest' || '' }}
          --quiet
      # Private loop worker: the share service image with its own CPUs, so preview loops never slow posters.
      # One warm instance renders one gallery (3 loops) at once with its persistent browsers; busier times
      # add instances up to the cap. Only the share service account may call it. It reuses the image just built.
      - name: Deploy loop worker
        if: ${{ vars.VITE_SHARE_API_ORIGIN != '' && vars.LOOP_WORKER_URL != '' }}
        run: >-
          gcloud run deploy cliphouse-loop --project cliphouse-app --region europe-west1
          --image "$(gcloud run services describe cliphouse-share --project cliphouse-app --region europe-west1 --format='value(spec.template.spec.containers[0].image)')"
          --service-account cliphouse-loop@cliphouse-app.iam.gserviceaccount.com
          --no-allow-unauthenticated --cpu 4 --memory 4Gi --concurrency 3
          --min-instances 1 --max-instances 8 --timeout 150 --cpu-boost
          --command node --args=--import,tsx,server/loop-worker.ts
          --set-env-vars HYPERFRAMES_NO_TELEMETRY=1,HYPERFRAMES_BROWSER_PATH=/usr/local/bin/hyperframes-chrome,NODE_ENV=production,GOOGLE_CLOUD_PROJECT=cliphouse-app,SHARE_BUCKET=cliphouse-app-shares
          --quiet
      - name: Deploy Hosting and rules
        run: |
          CONFIG=firebase.json
          if [ -n "$SHARE_API_ORIGIN" ]; then CONFIG=firebase.sharing.json; fi
          npx firebase deploy --project cliphouse-app --config "$CONFIG" --only firestore:rules,hosting --non-interactive
        env:
          GOOGLE_CLOUD_QUOTA_PROJECT: cliphouse-app
          SHARE_API_ORIGIN: ${{ vars.VITE_SHARE_API_ORIGIN }}
