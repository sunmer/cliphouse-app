<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1920px; }
    .stripes { position:absolute; inset:-200px; background:repeating-linear-gradient(-28deg, var(--theme-surface) 0 70px, transparent 70px 150px); opacity:.65; }
    .pass { position:absolute; left:110px; top:250px; width:860px; height:1320px; background:var(--theme-foreground); color:var(--theme-background); padding:86px; border-radius:8px; }
    .pass:before, .pass:after { content:""; position:absolute; top:800px; width:92px; height:92px; border-radius:50%; background:var(--theme-background); }
    .pass:before { left:-46px; } .pass:after { right:-46px; }
    .perf { position:absolute; left:76px; right:76px; top:846px; border-top:6px dashed var(--theme-background); opacity:.25; }
    .brand { font-size:38px; color:var(--theme-accent); text-transform:uppercase; }
    .headline { margin-top:120px; height:420px; font-size:122px; line-height:.9; }
    .date { position:absolute; left:86px; right:86px; top:940px; height:150px; font-size:58px; line-height:1.1; }
    .cta { position:absolute; left:86px; right:86px; bottom:86px; padding:34px; text-align:center; font-size:52px; background:var(--theme-accent); color:var(--theme-background); }
    .lineup { padding:150px 104px; display:flex; flex-direction:column; justify-content:center; gap:44px; }
    .eyebrow { font-size:34px; color:var(--theme-accent); text-transform:uppercase; }
    .item { min-height:190px; padding:36px 46px; display:flex; align-items:center; gap:34px; background:var(--theme-surface); border-left:16px solid var(--theme-accent); font-size:66px; }
    .item .fit { display:block; width:660px; height:80px; }
    .item:nth-child(3) { border-color:var(--theme-accent2); }
    .dot { width:28px; height:28px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
    <section id="eventpass-ticket" class="scene s1 clip" data-start="0" data-duration="5.4" data-track-index="0">
      <div class="stripes"></div><div class="pass"><div class="brand display" data-text-role="brand" data-var-text="text_brand">Brand</div><h1 class="headline display fit" data-fit-max="122" data-fit-min="72" data-text-role="headline" data-var-text="text_headline">Headline</h1><div class="perf"></div><p class="date display fit" data-fit-max="58" data-fit-min="40" data-text-role="date" data-var-text="text_date">Date</p><div class="cta display" data-text-role="cta" data-var-text="text_cta">CTA</div></div>
    </section>
    <section id="eventpass-program" class="scene s2 lineup clip" data-start="5.4" data-duration="4.6" data-track-index="0">
      <div class="eyebrow mono">On the program</div>
      <div class="item display"><span class="dot"></span><span class="fit" data-fit-max="66" data-fit-min="46" data-text-role="point1" data-var-text="text_point1">Point 1</span></div>
      <div class="item display"><span class="dot"></span><span class="fit" data-fit-max="66" data-fit-min="46" data-text-role="point2" data-var-text="text_point2">Point 2</span></div>
      <div class="item display"><span class="dot"></span><span class="fit" data-fit-max="66" data-fit-min="46" data-text-role="point3" data-var-text="text_point3">Point 3</span></div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    tl.from('.s1 .stripes', {x: -280, opacity: 0, duration: 1.4, ease: 'power3.out'}, 0)
      .from('.s1 .pass', {y: 1200, rotate: -9, duration: 1, ease: 'expo.out'}, .15)
      .from('.s1 .brand, .s1 .headline', {y: 60, opacity: 0, duration: .55, stagger: .14}, .82)
      .from('.s1 .perf', {scaleX: 0, transformOrigin: 'left center', duration: .5}, 1.3)
      .from('.s1 .date, .s1 .cta', {y: 60, opacity: 0, duration: .55, stagger: .12}, 1.45)
      .to('.s1 .pass', {rotate: 1.4, y: -24, duration: 2.6, ease: 'sine.inOut'}, 2.1)
      .from('.s2', {xPercent: 100, duration: .7, ease: 'power4.inOut'}, 5.4)
      .from('.s2 .eyebrow', {opacity: 0, y: -40, duration: .4}, 5.86)
      .from('.s2 .item', {xPercent: -110, duration: .62, stagger: .16, ease: 'back.out(1.25)'}, 6.0);
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
