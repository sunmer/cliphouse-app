<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1350" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1350px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }

    .band { position:absolute; inset:0; background:var(--theme-surface); }
    .callout { position:absolute; left:80px; top:196px; width:14px; height:296px; background:var(--theme-accent); }
    .headline { position:absolute; left:128px; top:192px; width:872px; height:304px; font-size:156px; line-height:.92; align-content:center; color:var(--theme-foreground); }

    .toprule { position:absolute; left:80px; top:152px; width:920px; height:3px; background:var(--theme-foreground); z-index:30; }
    .icon { position:absolute; left:80px; top:84px; width:58px; height:52px; background:var(--theme-foreground); clip-path:polygon(50% 0, 100% 100%, 0 100%); }
    .ibar, .idot { position:absolute; left:26px; width:6px; background:var(--theme-surface); }
    .ibar { top:17px; height:19px; }
    .idot { top:40px; height:6px; }
    .brand { position:absolute; left:162px; top:80px; width:838px; height:60px; font-size:48px; line-height:1.15; text-transform:uppercase; align-content:center; color:var(--theme-foreground); }

    .drule { position:absolute; left:80px; top:548px; width:920px; height:4px; background:var(--theme-foreground); }
    .elapse { position:absolute; left:80px; top:543px; width:904px; height:14px; background:var(--theme-accent); }
    .ddot { position:absolute; left:72px; top:541px; width:18px; height:18px; border-radius:50%; background:var(--theme-foreground); }
    .post { position:absolute; left:984px; top:520px; width:16px; height:56px; background:var(--theme-accent); }
    .drop { position:absolute; left:990px; top:576px; width:4px; height:610px; background:var(--theme-accent); }
    .dbox { position:absolute; left:80px; top:584px; width:880px; height:140px; font-size:72px; line-height:.95; align-content:end; }
    .date { color:var(--theme-foreground); }
    .dcopy { color:var(--theme-accent); }
    .dmark { position:absolute; left:80px; top:732px; width:880px; height:12px; background:var(--theme-accent); }

    .list { position:absolute; left:80px; top:768px; width:880px; height:384px; display:flex; flex-direction:column; z-index:1; }
    .row { position:relative; flex:none; height:calc(384px / var(--count, 3)); display:flex; align-items:center; gap:28px; }
    .slot { position:absolute; left:0; top:0; width:100%; height:3px; background:var(--theme-foreground); }
    .num { position:relative; flex:none; width:76px; height:76px; overflow:hidden; border:3px solid var(--theme-foreground); }
    .numa, .pn { position:absolute; inset:0; display:grid; place-items:center; font-size:32px; font-weight:700; }
    .numa { color:var(--theme-foreground); }
    .pip { position:absolute; inset:0; background:var(--theme-accent); }
    .pn { color:var(--theme-background); }
    .ltext { flex:none; width:776px; height:calc(384px / var(--count, 3) - 12px); font-size:54px; font-weight:700; line-height:1.04; align-content:center; color:var(--theme-foreground); }
    .lend { position:absolute; left:80px; top:1152px; width:880px; height:3px; background:var(--theme-foreground); }

    .meter { position:absolute; left:80px; top:1186px; width:920px; height:84px; display:flex; gap:16px; z-index:2; }
    .track { position:relative; flex:1; height:100%; background:var(--theme-surface); }
    .tn { position:absolute; left:22px; top:24px; font-size:32px; font-weight:700; line-height:1; color:var(--theme-foreground); }
    .fill { position:absolute; inset:0; background:var(--theme-accent2); }
    .fill .tn { color:var(--theme-surface); }

    .panel { position:absolute; left:0; top:1172px; width:1080px; height:178px; background:var(--theme-accent2); visibility:hidden; z-index:6; }
    .cta { position:absolute; left:80px; top:22px; width:740px; height:134px; font-size:84px; line-height:.95; align-content:center; color:var(--theme-background); }
    .stamp { position:absolute; left:880px; top:29px; width:120px; height:120px; background:var(--theme-accent); visibility:hidden; }
    .arrowwrap { position:absolute; left:24px; top:32px; width:72px; height:56px; }
    .arrow { position:absolute; inset:0; background:var(--theme-background); clip-path:polygon(0 38%, 56% 38%, 56% 8%, 100% 50%, 56% 92%, 56% 62%, 0 62%); }

    .sheet { position:absolute; inset:0; background:var(--theme-surface); z-index:20; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8.533" data-width="1080" data-height="1350">
    <section id="breakingchange-notice" class="scene" data-start="0" data-duration="8.533" data-track-index="0">
      <div class="band">
        <div class="callout"></div>
        <h1 class="headline display fit" data-fit-max="156" data-fit-min="84" data-text-role="headline" data-beat-text="headline">Headline</h1>
      </div>

      <div class="toprule"></div>
      <div class="icon"><i class="ibar"></i><i class="idot"></i></div>
      <div class="brand display fit" data-fit-max="48" data-fit-min="30" data-text-role="brand" data-beat-text="brand">Brand</div>

      <div class="drule"></div>
      <div class="elapse"></div>
      <div class="ddot"></div>
      <div class="post"></div>
      <div class="drop"></div>
      <div class="dbox date display fit" data-fit-max="72" data-fit-min="40" data-text-role="date" data-beat-text="date">Date</div>
      <div class="dbox dcopy display fit" data-text-copy data-fit-max="72" data-fit-min="40" data-beat-text="date">Date</div>
      <div class="dmark"></div>

      <div class="list" data-list>
        <template data-list-row>
          <div class="row">
            <div class="slot" data-list-part="slot" data-list-group="scaffold"></div>
            <div class="num" data-list-part="num" data-list-align="y">
              <span class="numa mono" data-list-number>01</span>
              <div class="pip" data-list-part="pip" data-list-align="y"><span class="pn mono" data-list-number>01</span></div>
            </div>
            <div class="ltext display fit" data-list-text data-words data-fit-max="54" data-fit-min="40">Item</div>
          </div>
        </template>
      </div>
      <div class="lend"></div>

      <div class="meter"></div>

      <div class="panel">
        <div class="cta display fit" data-fit-max="84" data-fit-min="44" data-text-role="cta" data-beat-text="cta">CTA</div>
        <div class="stamp"><div class="arrowwrap"><div class="arrow"></div></div></div>
      </div>

      <div class="sheet"></div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const count = m.items.length;

      // Reflow the ledger per count, then give every row the same type size.
      const lt = [...document.querySelectorAll('.ltext')];
      const fitMax = {1: 88, 2: 64, 3: 54}[count] || 54;
      const fitMin = {1: 52, 2: 44, 3: 40}[count] || 40;
      lt.forEach((el) => { el.dataset.fitMax = String(fitMax); el.dataset.fitMin = String(fitMin); });
      if (window.cliphouseFitText) window.cliphouseFitText();
      const size = Math.min(fitMax, ...lt.map((el) => parseFloat(el.style.fontSize) || fitMax));
      lt.forEach((el) => { el.style.fontSize = size + 'px'; el.dataset.fitMax = String(size); });

      // Words rise through masks on eighth notes; later words share the last slot so long text settles early.
      const words = (el, at, cap = 2, dur = 0.75) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 120}, {yPercent: 0, duration: B(dur), ease: 'expo.out'}, at + Math.min(i, cap) * B(0.5)));

      // Beat 0: the full warning field slides off to the right, leaving the band across the sheet.
      const poly = (x) => `polygon(${x}px 0px, 1080px 0px, 1080px 1350px, ${x}px 1350px, ${x}px 512px, 0px 512px, 0px 176px, ${x}px 176px)`;
      tl.fromTo('.band', {clipPath: poly(0)}, {clipPath: poly(1080), duration: B(1.25), ease: 'expo.out'}, t('band'));

      // Beat 1: brand and warning mark; the ledger rules and meter tracks build the sheet.
      tl.fromTo('.icon', {scale: 0, transformOrigin: '50% 70%'}, {scale: 1, duration: B(0.75), ease: 'back.out(1.2)'}, t('brand'));
      words(q('.brand'), t('brand'));
      m.items.forEach((it) => {
        const row = m.row(it.index);
        if (!row) return;
        tl.fromTo(row.querySelector('.slot'), {scaleX: 0, transformOrigin: '0% 50%'},
          {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('brand') + it.index * B(0.125));
      });
      const tracks = m.parts(q('.meter'), 'track', (it) => {
        const el = document.createElement('div');
        el.className = 'track';
        el.setAttribute('data-list-group', 'scaffold');
        el.innerHTML = '<span class="tn mono"></span><div class="fill"><span class="tn mono"></span></div>';
        el.querySelectorAll('.tn').forEach((s) => { s.textContent = String(it.index + 1).padStart(2, '0'); });
        m.tag(el.querySelector('.fill'), 'fill', it.index);
        return el;
      });
      tracks.forEach((el, i) => tl.fromTo(el, {scaleY: 0, transformOrigin: '50% 100%'},
        {scaleY: 1, duration: B(0.75), ease: 'expo.out'}, t('brand') + i * B(0.125)));

      // Beats 2-3: the headline names what is going away.
      words(q('.headline'), t('headline'));

      // Beat 3: the callout edge draws down the band; the deadline rule draws from today.
      tl.fromTo('.callout', {scaleY: 0, transformOrigin: '50% 0%'}, {scaleY: 1, duration: B(0.75), ease: 'expo.out'}, t('callout'));
      tl.fromTo('.ddot', {scale: 0, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('callout'));
      tl.fromTo('.drule', {scaleX: 0, transformOrigin: '0% 50%'}, {scaleX: 1, duration: B(1), ease: 'expo.out'}, t('callout'));

      // Beat 4: the deadline post lands at the end of the rule as the date rises.
      tl.fromTo('.post', {scaleY: 0, transformOrigin: '50% 100%'}, {scaleY: 1, duration: B(0.5), ease: 'back.out(1.2)'}, t('date'));
      words(q('.date'), t('date'));

      // Beat 5: the red underline draws under the date; beat 6: the ledger closes.
      tl.fromTo('.dmark', {scaleX: 0, transformOrigin: '0% 50%'}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('mark'));
      tl.fromTo('.lend', {scaleX: 0, transformOrigin: '0% 50%'}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('lend'));

      // Beats 6-9: each change lands on its start; its number box and meter segment fill on its accent.
      m.items.forEach((it, i) => {
        const row = m.row(it.index);
        if (row) {
          tl.fromTo(row.querySelector('.num'), {clipPath: 'inset(0% 0% 100% 0%)'},
            {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, it.start);
          tl.fromTo(row.querySelector('.numa'), {yPercent: 110}, {yPercent: 0, duration: B(0.75), ease: 'expo.out'}, it.start);
          words(row.querySelector('.ltext'), it.start);
          tl.fromTo(row.querySelector('.pip'), {clipPath: 'inset(100% 0% 0% 0%)'},
            {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, it.accent);
        }
        const fill = tracks[i] && tracks[i].querySelector('.fill');
        if (fill) tl.fromTo(fill, {clipPath: 'inset(0% 100% 0% 0%)'},
          {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.75), ease: 'expo.out'}, it.accent);
      });

      // Beat 9: the elapsed bar runs along the rule into the deadline post.
      tl.fromTo('.elapse', {scaleX: 0, transformOrigin: '0% 50%'}, {scaleX: 1, duration: B(0.875), ease: 'expo.out'}, t('elapse'));

      // Beat 10: the date is wiped over in red: the deadline is set.
      tl.fromTo('.dcopy', {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.75), ease: 'expo.out'}, t('deadline'));

      // Beat 11: the deadline drops down the margin to the meter.
      tl.fromTo('.drop', {scaleY: 0, transformOrigin: '50% 0%'}, {scaleY: 1, duration: B(0.75), ease: 'expo.out'}, t('drop'));

      // Beat 12: the filled meter floods into the CTA panel; the CTA rises on 12.5.
      tl.set('.panel', {visibility: 'visible'}, t('panel'));
      tl.fromTo('.panel', {clipPath: 'inset(14px 80px 80px 80px)'},
        {clipPath: 'inset(0px 0px 0px 0px)', duration: B(0.625), ease: 'power3.out'}, t('panel'));
      words(q('.cta'), t('cta'), 0, 0.5);

      // Beat 13: the stamp lands beside the CTA; beat 14: its arrow draws.
      tl.set('.stamp', {visibility: 'visible'}, t('stamp'));
      tl.fromTo('.stamp', {scale: 1.4, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.5), ease: 'power3.out'}, t('stamp'));
      tl.fromTo('.arrowwrap', {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, t('arrow'));

      // Beat 15: the stamp floods yellow to the farthest corner, back to the warning field of frame 0.
      tl.fromTo('.sheet', {clipPath: 'circle(0px at 940px 1261px)'},
        {clipPath: 'circle(1600px at 940px 1261px)', duration: B(0.625), ease: 'power3.out'}, t('close'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
