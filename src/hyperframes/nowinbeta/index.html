<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }

    .flood { position:absolute; inset:0; background:var(--theme-accent); }

    .chip { position:absolute; left:90px; top:101px; width:26px; height:26px; border-radius:50%; background:var(--theme-accent2); }
    .brand { position:absolute; left:132px; top:88px; width:520px; height:52px; font-size:40px; line-height:1.3; font-weight:800; text-transform:uppercase; color:var(--theme-foreground); }

    .card { position:absolute; left:90px; top:180px; width:900px; height:470px; border-radius:28px; background:var(--theme-surface); }
    .toggle { position:absolute; left:50px; top:46px; width:100px; height:54px; border-radius:27px; background:var(--theme-background); overflow:hidden; }
    .tg-on { position:absolute; inset:0; background:var(--theme-accent2); }
    .knob { position:absolute; left:7px; top:7px; width:40px; height:40px; border-radius:50%; background:var(--theme-foreground); }
    .headline { position:absolute; left:140px; top:320px; width:800px; height:300px; font-size:200px; line-height:.9; color:var(--theme-foreground); }

    .marks { position:absolute; left:740px; top:80px; width:260px; height:260px; }
    .m { position:absolute; width:42px; height:42px; border:0 solid var(--theme-foreground); }
    .m.tl { left:0; top:0; border-top-width:6px; border-left-width:6px; transform-origin:0% 0%; }
    .m.tr { right:0; top:0; border-top-width:6px; border-right-width:6px; transform-origin:100% 0%; }
    .m.bl { left:0; bottom:0; border-bottom-width:6px; border-left-width:6px; transform-origin:0% 100%; }
    .m.br { right:0; bottom:0; border-bottom-width:6px; border-right-width:6px; transform-origin:100% 100%; }

    .marker { position:absolute; left:90px; top:700px; width:12px; height:110px; background:var(--theme-accent2); transform-origin:50% 0%; }
    .subhead { position:absolute; left:126px; top:692px; width:864px; height:128px; font-size:50px; line-height:1.15; font-weight:600; color:var(--theme-foreground); }

    .track { position:absolute; left:90px; top:922px; width:900px; height:6px; background:var(--theme-foreground); transform-origin:0 50%; }
    .pill { position:absolute; left:90px; top:860px; width:900px; height:130px; border-radius:65px; background:var(--theme-foreground); overflow:hidden; }
    .press { position:absolute; inset:0; background:var(--theme-accent2); }
    .cta { position:absolute; left:60px; top:15px; width:720px; height:100px; font-size:62px; line-height:1; text-align:center; align-content:center; text-transform:uppercase; color:var(--theme-background); }

    .seal { position:absolute; left:765px; top:105px; width:210px; height:210px; border-radius:50%; background:var(--theme-accent); overflow:hidden; }
    .seal-ink { position:absolute; inset:0; background:var(--theme-foreground); }
    .ring { position:absolute; inset:12px; border:4px solid var(--theme-background); border-radius:50%; }
    .beta { position:absolute; left:45px; top:38px; width:120px; height:134px; }
    .beta path { fill:none; stroke:var(--theme-background); stroke-width:9; stroke-linecap:round; stroke-linejoin:round; }

    .cursor { position:absolute; left:900px; top:955px; width:50px; height:82px; }
    .ptr, .ptr-o { position:absolute; left:0; top:0; width:50px; height:82px; clip-path:polygon(0 0, 0 68px, 17px 53px, 29px 81px, 40px 76px, 29px 49px, 49px 49px); }
    .ptr-o { background:var(--theme-background); transform:scale(1.22); transform-origin:16px 40px; }
    .ptr { background:var(--theme-foreground); }
    .tick { position:absolute; background:var(--theme-background); border-radius:3px; }
    .tick.t1 { left:-4px; top:-38px; width:7px; height:22px; transform-origin:50% 100%; }
    .tick.t2 { left:-28px; top:-32px; width:7px; height:22px; transform-origin:50% 100%; }
    .tick.t3 { left:-40px; top:-4px; width:22px; height:7px; transform-origin:100% 50%; }

    .wipe { position:absolute; inset:0; background:var(--theme-background); z-index:10; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
    <section id="nowinbeta-title" class="scene s1 clip" data-start="0" data-duration="8" data-track-index="0">
      <div class="flood"></div>
      <div class="chip"></div>
      <div class="brand display fit" data-fit-max="40" data-fit-min="24" data-text-role="brand" data-beat-text="brand">Brand</div>
      <div class="card">
        <div class="toggle"><div class="tg-on"></div><div class="knob"></div></div>
      </div>
      <h1 class="headline display fit" data-fit-max="200" data-fit-min="84" data-text-role="headline" data-beat-text="headline">Headline</h1>
      <div class="marks" data-layout-allow-overflow>
        <div class="m tl"></div><div class="m tr"></div><div class="m bl"></div><div class="m br"></div>
      </div>
    </section>
    <section id="nowinbeta-who" class="scene s2 clip" data-start="0" data-duration="8" data-track-index="1">
      <div class="marker"></div>
      <p class="subhead fit" data-fit-max="50" data-fit-min="30" data-text-role="subhead" data-beat-text="subhead">Subhead</p>
    </section>
    <section id="nowinbeta-join" class="scene s3 clip" data-start="0" data-duration="8" data-track-index="2">
      <div class="track"></div>
      <div class="pill">
        <div class="press"></div>
        <div class="cta display fit" data-fit-max="62" data-fit-min="32" data-text-role="cta" data-beat-text="cta">CTA</div>
      </div>
      <div class="seal" data-layout-allow-overflow>
        <div class="seal-ink"></div>
        <div class="ring"></div>
        <svg class="beta" viewBox="6 0 100 100" aria-hidden="true"><path d="M32 97 V30 C32 13 43 5 55 5 C68 5 76 14 76 25 C76 37 67 45 48 45 C70 45 81 55 81 68 C81 82 70 91 56 91 C45 91 37 87 32 80" /></svg>
      </div>
      <div class="cursor" data-layout-allow-overflow>
        <div class="tick t1"></div><div class="tick t2"></div><div class="tick t3"></div>
        <div class="ptr-o"></div><div class="ptr"></div>
      </div>
    </section>
    <div class="wipe" data-layout-allow-overflow></div>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      // Words rise through masks on eighth notes. Words past the cap share the last slot, so long text settles on time.
      const words = (el, start, cap) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 125}, {yPercent: 0, duration: B(0.75), ease: 'expo.out'}, start + Math.min(i, cap) * B(0.5)));
      const SEAL = 'at 870px 210px';
      const CLICK = 'at 900px 955px';
      const FLOOD = B(2 / 3);

      // Start state: the flag is off, the marks wait wide, and the button is fully closed on its centerline.
      tl.set('.tg-on', {clipPath: 'inset(0% 100% 0% 0%)'}, B(0));
      tl.set('.knob', {x: 0}, B(0));
      tl.set('.marks', {scale: 1.25, rotation: 0}, B(0));
      tl.set('.pill', {clipPath: 'inset(65px 0px 65px 0px)', scale: 1, transformOrigin: '50% 50%'}, B(0));

      // Beat 0: the brand dot pops, and the brand rises.
      tl.fromTo('.chip', {scale: 0}, {scale: 1, duration: B(0.5), ease: 'back.out(1.2)'}, t('brand'));
      words(q('.brand'), t('brand'), 1);

      // Beat 1: the feature card wipes open from the left, carrying its flag toggle.
      tl.fromTo('.card', {clipPath: 'inset(0% 100% 0% 0%)'},
        {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.75), ease: 'expo.out'}, t('card'));

      // Beats 2-2.5: the feature name rises at hero size.
      words(q('.headline'), t('headline'), 1);

      // Beat 3: crop marks snap onto the card's corner, marking the target.
      tl.fromTo('.m', {scale: 0}, {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('marks'));

      // Beats 4-5: who can join, then the marker draws beside it.
      words(q('.subhead'), t('subhead'), 2);
      tl.fromTo('.marker', {scaleY: 0}, {scaleY: 1, duration: B(0.75), ease: 'expo.out'}, t('marker'));

      // Beat 6: the button track draws across the empty bottom band.
      tl.fromTo('.track', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('track'));

      // Beat 7: the seal drops in from above the frame and hovers over the target.
      tl.fromTo('.seal', {y: -440, rotation: -30, scale: 1.25},
        {y: -70, rotation: -18, scale: 1.25, duration: B(0.75), ease: 'expo.out'}, t('sealDrop'));

      // Beat 8: the track opens from its centerline into the button, and the CTA rises inside it.
      tl.to('.pill', {clipPath: 'inset(0px 0px 0px 0px)', duration: B(0.75), ease: 'expo.out'}, t('cta'));
      words(q('.cta'), t('cta'), 1);

      // Beat 9: the marks tighten and turn to the stamp angle.
      tl.to('.marks', {scale: 1, rotation: -10, duration: B(0.75), ease: 'expo.out'}, t('marksLock'));

      // Beat 10: wind-up.
      tl.to('.seal', {y: -110, rotation: -22, scale: 1.35, duration: B(0.5), ease: 'power2.out'}, t('windUp'));

      // Beat 11: the slam lands exactly on the beat. The card takes the hit and the flag flips on.
      tl.to('.seal', {y: 0, rotation: -10, scale: 1, duration: B(0.35), ease: 'power3.in'}, t('stamp') - B(0.35));
      tl.fromTo(['.card', '.headline'], {y: 0}, {y: 12, duration: B(0.15), ease: 'power2.out'}, t('stamp'));
      tl.to(['.card', '.headline'], {y: 0, duration: B(0.6), ease: 'expo.out'}, t('stamp') + B(0.15));
      tl.to('.knob', {x: 46, duration: B(0.5), ease: 'expo.out'}, t('stamp'));
      tl.to('.tg-on', {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, t('stamp'));
      tl.to('.m', {scale: 0, duration: B(0.5), ease: 'expo.out'}, t('stamp'));

      // Beat 12: the seal's ink floods the page in 10 frames, and the seal fills dark.
      tl.fromTo('.flood', {clipPath: `circle(0px ${SEAL})`},
        {clipPath: `circle(1260px ${SEAL})`, duration: FLOOD, ease: 'power3.out'}, t('flood'));
      tl.fromTo('.seal-ink', {clipPath: 'circle(0% at 50% 50%)'},
        {clipPath: 'circle(75% at 50% 50%)', duration: B(0.5), ease: 'expo.out'}, t('flood'));

      // Beat 13: a cursor glides onto the button.
      tl.fromTo('.cursor', {x: 260, y: 220, scale: 1, transformOrigin: '0px 0px'},
        {x: 0, y: 0, duration: B(0.75), ease: 'expo.out'}, t('cursor'));

      // Beat 14: click. The button presses, ticks pop, and blue ink fills it from the click point.
      tl.to('.cursor', {scale: 0.86, duration: B(0.15), ease: 'power2.out'}, t('click'));
      tl.to('.cursor', {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('click') + B(0.15));
      tl.to('.pill', {scale: 0.97, duration: B(0.15), ease: 'power2.out'}, t('click'));
      tl.to('.pill', {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('click') + B(0.15));
      tl.fromTo('.press', {clipPath: 'circle(0px at 810px 95px)'},
        {clipPath: 'circle(840px at 810px 95px)', duration: B(0.5), ease: 'expo.out'}, t('click'));
      tl.fromTo('.t1', {scale: 0, rotation: 0}, {scale: 1, rotation: 0, duration: B(0.3), ease: 'expo.out'}, t('click'));
      tl.fromTo('.t2', {scale: 0, rotation: -45}, {scale: 1, rotation: -45, duration: B(0.3), ease: 'expo.out'}, t('click'));
      tl.fromTo('.t3', {scale: 0, rotation: 0}, {scale: 1, rotation: 0, duration: B(0.3), ease: 'expo.out'}, t('click'));
      tl.to('.tick', {scale: 0, duration: B(0.4), ease: 'power2.in'}, t('click') + B(0.5));

      // Beat 15: cream floods out from the click back to the blank first frame.
      tl.fromTo('.wipe', {clipPath: `circle(0px ${CLICK})`},
        {clipPath: `circle(1340px ${CLICK})`, duration: FLOOD, ease: 'power3.out'}, t('loopFlood'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
