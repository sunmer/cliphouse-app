<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; white-space:nowrap; overflow-wrap:normal; }
    .w { display:inline-block; white-space:nowrap; overflow-wrap:normal; }

    /* Layer order: table (columns < flood < checks) < end screen pieces < big check < loop flood < brand < headline */
    .table { z-index:1; }
    .end { z-index:3; pointer-events:none; }
    .endflood { position:absolute; inset:0; z-index:5; background:var(--theme-background); clip-path:circle(0px at 864px 899px); }
    .flood { position:absolute; inset:0; z-index:2; background:var(--theme-accent); clip-path:inset(540px 540px 540px 540px); }

    /* The two bars that fold into the two columns */
    .col { position:absolute; inset:0; }
    .colA { background:var(--theme-accent); clip-path:inset(600px 1000px 290px 80px); }
    .colB { background:color-mix(in srgb, var(--theme-accent2) 28%, var(--theme-background)); clip-path:inset(810px 1000px 80px 80px); }

    svg path { fill:none; stroke-dasharray:1 1; stroke-dashoffset:1; stroke-linecap:butt; stroke-linejoin:miter; }
    .ck { stroke:var(--theme-foreground); stroke-width:14; }
    .xk { stroke:var(--theme-accent2); stroke-width:11; }
    .ap { stroke:var(--theme-accent); stroke-width:12; }
    .mark { position:absolute; width:96px; height:96px; overflow:visible; transform-origin:50% 50%; }
    .bigcheck { left:646px; top:647px; z-index:4; }
    .tcross { left:896px; top:857px; }

    /* Header pieces */
    .redact { position:absolute; left:904px; top:114px; width:80px; height:22px; background:var(--theme-accent2); transform-origin:0 50%; transform:scaleX(0); }
    .hbar { position:absolute; left:80px; top:280px; width:420px; height:8px; background:var(--theme-accent); transform-origin:0 50%; transform:scaleX(0); }

    /* Fixed text (top-aligned so the fit helper measures true overflow) */
    .brand { position:absolute; left:80px; top:80px; width:440px; height:72px; z-index:6; font-size:60px; line-height:1; white-space:nowrap; align-content:start; color:var(--theme-foreground); }
    .headline { position:absolute; left:80px; top:170px; width:920px; height:400px; z-index:7; font-size:176px; line-height:.9; align-content:start; color:var(--theme-foreground); }

    /* Rows reflow by count */
    .rows { position:absolute; left:80px; top:300px; width:920px; height:700px; display:flex; flex-direction:column; visibility:hidden;
      --rowh: calc(700px / var(--count, 4)); --ck: min(132px, calc(var(--rowh) * .5)); --xk: min(76px, calc(var(--rowh) * .38)); }
    .row { position:relative; flex:none; height:var(--rowh); }
    .rtext { position:absolute; left:0; top:12px; width:420px; height:calc(var(--rowh) - 24px); font-size:76px; line-height:1; align-content:center; color:var(--theme-foreground); }
    .cell { position:absolute; display:block; transform-origin:50% 50%; visibility:hidden; }
    .cellA { z-index:3; left:calc(614px - var(--ck) / 2); top:calc(50% - var(--ck) / 2); width:var(--ck); height:var(--ck); }
    .cellB { left:calc(864px - var(--xk) / 2); top:calc(50% - var(--xk) / 2); width:var(--xk); height:var(--xk); }
    .pulse { display:block; width:100%; height:100%; transform-origin:50% 50%; }
    .cell svg { display:block; width:100%; height:100%; overflow:visible; }
    .divider { position:absolute; left:0; bottom:0; width:920px; height:3px; background:color-mix(in srgb, var(--theme-foreground) 18%, transparent); transform-origin:0 50%; transform:scaleX(0); }

    /* End screen pieces (each hidden by its own scale or clip until its beat) */
    .brule { position:absolute; left:80px; top:228px; width:240px; height:12px; background:var(--theme-foreground); transform-origin:0 50%; transform:scaleX(0); }
    .slab { position:absolute; left:80px; top:300px; width:920px; height:700px; background:var(--theme-foreground); clip-path:inset(100% 0% 0% 0%); transform-origin:50% 50%; }
    .cta { position:absolute; left:64px; top:56px; width:792px; height:440px; font-size:170px; line-height:.95; align-content:start; color:var(--theme-surface); }
    .arrow { position:absolute; right:56px; bottom:56px; width:160px; height:90px; overflow:visible; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1080">
    <section id="whyswitch-table" class="scene table clip" data-start="0" data-duration="10" data-track-index="0">
      <div class="col colA" data-layout-allow-overflow></div>
      <div class="col colB" data-layout-allow-overflow></div>
      <svg class="mark tcross" viewBox="0 0 100 100"><path class="xk" pathLength="1" d="M20 20 L80 80 M80 20 L20 80"/></svg>
      <i class="redact"></i>
      <i class="hbar"></i>
      <div class="flood" data-layout-allow-overflow></div>
      <div class="rows" data-list>
        <template data-list-row>
          <div class="row">
            <div class="rtext display fit" data-list-text data-words data-fit-max="76" data-fit-min="40"></div>
            <span class="cell cellA" data-list-part="check" data-list-align="y"><span class="pulse" data-list-part="pulse" data-list-group="finale"><svg viewBox="0 0 100 100"><path class="ck" pathLength="1" d="M14 54 L40 78 L88 24"/></svg></span></span>
            <span class="cell cellB" data-list-part="cross" data-list-align="y"><svg viewBox="0 0 100 100"><path class="xk" pathLength="1" d="M20 20 L80 80 M80 20 L20 80"/></svg></span>
            <i class="divider" data-list-part="divider" data-list-group="scaffold"></i>
          </div>
        </template>
      </div>
    </section>
    <section id="whyswitch-end" class="scene end clip" data-start="0" data-duration="10" data-track-index="1">
      <i class="brule"></i>
      <div class="slab">
        <div class="cta display fit" data-fit-max="170" data-fit-min="72" data-text-role="cta" data-beat-text="cta"></div>
        <svg class="arrow" viewBox="0 0 160 90"><path class="ap" pathLength="1" d="M6 45 H142 M108 12 L142 45 L108 78"/></svg>
      </div>
    </section>
    <svg class="mark bigcheck" viewBox="0 0 100 100"><path class="ck" pathLength="1" d="M14 54 L40 78 L88 24"/></svg>
    <div class="endflood" data-layout-allow-overflow></div>
    <div class="brand display" data-fit-max="60" data-fit-min="36" data-text-role="brand" data-beat-text="brand"></div>
    <h1 class="headline display fit" data-fit-max="176" data-fit-min="96" data-text-role="headline" data-beat-text="headline"></h1>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    // Reason size per count, then every row shares the smallest fitted size so the table reads as one set.
    const ROW_MAX = {1: 120, 2: 104, 3: 88, 4: 76};
    const unifyRows = () => {
      const els = [...document.querySelectorAll('[data-list] .rtext')];
      if (!els.length) return;
      const size = Math.min(...els.map((el) => parseFloat(el.style.fontSize) || Number(el.dataset.fitMax)));
      for (const el of els) el.style.fontSize = size + 'px';
    };
    document.fonts?.ready.then(unifyRows);

    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const rowMax = ROW_MAX[Math.max(1, Math.min(4, m.items.length))];
      for (const el of document.querySelectorAll('[data-list] .rtext')) el.dataset.fitMax = String(rowMax);
      window.cliphouseFitText?.();
      unifyRows();

      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const qa = (s) => [...document.querySelectorAll(s)];
      const arr = (x) => (Array.isArray(x) ? x : [x]).filter(Boolean);
      const S = (x, vars, at = 0) => { const a = arr(x); if (a.length) tl.set(a, vars, at); };
      const ft = (x, from, to, at) => { const a = arr(x); if (a.length) tl.fromTo(a, from, {...to, immediateRender: false}, at); };
      const draw = (path, at, dur = 0.5) => ft(path, {strokeDashoffset: 1}, {strokeDashoffset: 0, duration: B(dur), ease: 'power3.out'}, at);
      const grow = (el, at, dur = 0.75) => ft(el, {scaleX: 0}, {scaleX: 1, duration: B(dur), ease: 'expo.out'}, at);
      const clip = (el, from, to, at, dur, ease = 'expo.out') => ft(el, {clipPath: from}, {clipPath: to, duration: B(dur), ease}, at);
      const rise = (el, at, step = 0.125, cap = 2, dur = 0.6) => m.spans(el).forEach((w, i) =>
        ft(w, {yPercent: 110}, {yPercent: 0, duration: B(dur), ease: 'expo.out'}, at + B(Math.min(i, cap) * step)));
      const drop = (el, at) => ft(m.spans(el), {yPercent: 0}, {yPercent: -110, duration: B(0.35), ease: 'power2.in'}, at);

      const brand = q('.brand'), head = q('.headline'), cta = q('.cta'), rows = q('.rows');
      const colA = q('.colA'), colB = q('.colB'), big = q('.bigcheck'), tcross = q('.tcross');
      const BAND_A0 = 'inset(600px 1000px 290px 80px)', BAND_A = 'inset(600px 80px 290px 80px)';
      const BAND_B0 = 'inset(810px 1000px 80px 80px)', BAND_B = 'inset(810px 80px 80px 80px)';
      const COL_A = 'inset(80px 216px 80px 524px)', COL_A2 = 'inset(80px 208px 80px 516px)';
      const COL_B = 'inset(80px 80px 80px 888px)';
      const FLOOD0 = 'inset(540px 540px 540px 540px)', FULL = 'inset(0px 0px 0px 0px)';
      const LOOP0 = 'circle(0px at 864px 899px)', LOOP1 = 'circle(1300px at 864px 899px)';
      // Brand states: home (top-left), column header, lockup.
      const HOME = {x: 0, y: 0, scale: 1}, COLHEAD = {x: 460, y: 20, scale: 0.7}, LOCK = {x: 0, y: 16, scale: 1.55};
      // Check states: in the green bar, column header icon, giant lockup check.
      const CK0 = {x: 0, y: 0, scale: 1}, CKH = {x: 0, y: -497, scale: 0.6}, CKL = {x: 186, y: -505, scale: 2.2};

      // Frame 0: brand and headline readable on the background; everything else waits.
      S(m.spans(brand), {yPercent: 0});
      S(m.spans(head), {yPercent: 0});
      S(brand, {...HOME, transformOrigin: '0% 0%'});
      S(head, {x: 0, y: 0, scale: 1, transformOrigin: '0% 0%', visibility: 'visible'});
      S(colA, {clipPath: BAND_A0});
      S(colB, {clipPath: BAND_B0});
      S(big, {...CK0, transformOrigin: '50% 50%'});
      S(tcross, {x: 0, y: 0, scale: 1, transformOrigin: '50% 50%'});
      S(qa('svg path'), {strokeDashoffset: 1});
      S(qa('[data-list] .w'), {yPercent: 110});
      S(m.spans(cta), {yPercent: 110});
      S([...qa('[data-list] .divider'), q('.redact'), q('.hbar'), q('.brule')], {scaleX: 0});
      S(qa('[data-list] .cell, [data-list] .pulse'), {scale: 1});
      S(qa('[data-list] .cell'), {visibility: 'hidden'});
      S(q('.flood'), {clipPath: FLOOD0});
      S(q('.endflood'), {clipPath: LOOP0});
      S(q('.slab'), {clipPath: 'inset(100% 0% 0% 0%)', scale: 1});
      S(q('.arrow'), {x: 0});
      S(rows, {visibility: 'hidden'});

      // Beats 0-3: two bars, us and the unnamed old way, with their marks.
      clip(colA, BAND_A0, BAND_A, t('greenBand'), 0.75);
      draw(q('.bigcheck path'), t('teaseCheck'));
      clip(colB, BAND_B0, BAND_B, t('greyBand'), 0.75);
      draw(q('.tcross path'), t('teaseCross'));

      // Beat 4: the bars fold into columns; marks become header icons; headline and brand step into the header.
      clip(colA, BAND_A, COL_A, t('table'), 1);
      clip(colB, BAND_B, COL_B, t('table'), 1);
      ft(big, CK0, {...CKH, duration: B(1), ease: 'expo.out'}, t('table'));
      ft(tcross, {y: 0, scale: 1}, {y: -707, scale: 0.5, duration: B(1), ease: 'expo.out'}, t('table'));
      ft(head, {y: 0, scale: 1}, {y: -90, scale: 0.46, duration: B(1), ease: 'expo.out'}, t('table'));
      ft(brand, HOME, {...COLHEAD, duration: B(1), ease: 'expo.out'}, t('table'));
      S(rows, {visibility: 'visible'}, t('table') + B(0.5));

      // Beat 5: row rules draw (scaffold). Beat 6: the old way stays a redacted bar.
      qa('[data-list] [data-list-part="divider"]').forEach((d) =>
        grow(d, t('scaffold') + B(Number(d.dataset.listItem) * 0.125)));
      grow(q('.redact'), t('redacted'), 0.6);

      // Reasons: words rise with a quiet cross on the start beat; the check stamps on the accent, one beat later.
      m.items.forEach((it) => {
        const row = m.row(it.index);
        if (!row) return;
        const cellA = row.querySelector('.cellA'), cellB = row.querySelector('.cellB');
        rise(row.querySelector('.rtext'), it.start, 0.125, 2, 0.5);
        S(cellB, {visibility: 'visible'}, it.start);
        draw(cellB.querySelector('path'), it.start, 0.5);
        S(cellA, {visibility: 'visible'}, it.accent);
        ft(cellA, {scale: 1.3}, {scale: 1, duration: B(0.6), ease: 'expo.out'}, it.accent);
        draw(cellA.querySelector('path'), it.accent, 0.35);
      });

      // Beat 9: the brand column steps wider. Beat 10: every check punches at once. Beat 11: green header rule.
      clip(colA, COL_A, COL_A2, t('columnStep'), 0.75);
      const pulses = qa('[data-list] [data-list-group="finale"]');
      ft(pulses, {scale: 1}, {scale: 1.16, duration: B(0.15), ease: 'power2.out'}, t('checksPunch'));
      ft(pulses, {scale: 1.16}, {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('checksPunch') + B(0.15));
      grow(q('.hbar'), t('headRule'));

      // Beat 12: the brand column floods the frame and stays as the end-screen floor. Checks collapse,
      // reasons and headline drop out of their masks, then the whole table text leaves the layout.
      clip(q('.flood'), COL_A2, FULL, t('flood'), 0.7, 'power3.out');
      ft(qa('[data-list] .cellA'), {scale: 1}, {scale: 0, duration: B(0.45), ease: 'power3.in'}, t('flood'));
      qa('[data-list] .rtext').forEach((el) => drop(el, t('flood')));
      drop(head, t('flood'));
      S(head, {visibility: 'hidden'}, t('flood') + B(0.5));
      S(qa('[data-list] .cell'), {visibility: 'hidden'}, t('flood') + B(0.5));
      S(rows, {visibility: 'hidden'}, t('flood') + B(0.5));
      ft(brand, COLHEAD, {...LOCK, duration: B(1), ease: 'expo.out'}, t('flood'));
      ft(big, CKH, {...CKL, duration: B(1), ease: 'expo.out'}, t('flood'));

      // Beat 13: the brand rule draws. Beats 13.5-14: the CTA slab rises and stamps; words rise through masks.
      S(head, {y: 0, scale: 1}, t('brandRule'));
      grow(q('.brule'), t('brandRule'));
      clip(q('.slab'), 'inset(100% 0% 0% 0%)', 'inset(0% 0% 0% 0%)', t('ctaStamp') - B(0.5), 0.5, 'power3.in');
      ft(q('.slab'), {scale: 1.06}, {scale: 1, duration: B(0.75), ease: 'expo.out'}, t('ctaStamp'));
      rise(cta, t('ctaStamp'), 0.25, 1);

      // Beats 15-17: arrow draws, the giant check punches, the arrow steps forward.
      draw(q('.arrow path'), t('arrow'), 0.5);
      ft(big, {scale: CKL.scale}, {scale: 2.36, duration: B(0.15), ease: 'power2.out'}, t('bigPunch'));
      ft(big, {scale: 2.36}, {scale: CKL.scale, duration: B(0.5), ease: 'expo.out'}, t('bigPunch') + B(0.15));
      ft(q('.arrow'), {x: 0}, {x: 24, duration: B(0.75), ease: 'expo.out'}, t('arrowStep'));

      // Beat 18: background opens from the arrow while the brand glides home. Beat 19: the headline rises back.
      clip(q('.endflood'), LOOP0, LOOP1, t('loopFlood'), 0.7, 'power3.out');
      ft(brand, LOCK, {...HOME, duration: B(1), ease: 'expo.out'}, t('loopFlood'));
      S(big, CK0, t('loopFlood') + B(0.75));
      S(q('.bigcheck path'), {strokeDashoffset: 1}, t('loopFlood') + B(0.75));
      S(head, {visibility: 'visible'}, t('headline'));
      rise(head, t('headline'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
