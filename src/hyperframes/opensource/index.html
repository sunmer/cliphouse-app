<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }

    /* The padlock: shackle, two body halves, seam, cylinder. */
    .shackle { position:absolute; left:330px; top:230px; width:420px; height:300px; border:44px solid var(--theme-foreground); border-bottom:0; border-radius:210px 210px 0 0; z-index:1; }
    .half { position:absolute; top:460px; width:420px; height:500px; background:var(--theme-accent); overflow:hidden; z-index:2; }
    .half.l { left:120px; border-radius:12px 0 0 12px; }
    .half.r { left:540px; border-radius:0 12px 12px 0; }
    .code { position:absolute; top:0; width:372px; height:500px; }
    .l .code { left:52px; }
    .r .code { right:52px; }
    .ln { position:absolute; height:18px; border-radius:3px; background:color-mix(in srgb, var(--theme-background) 30%, transparent); }
    .seam { position:absolute; left:537px; top:460px; width:6px; height:500px; background:var(--theme-background); z-index:3; transform-origin:50% 0; }
    .cyl { position:absolute; left:470px; top:640px; width:140px; height:140px; border-radius:50%; background:var(--theme-background); z-index:4; }
    .slot { position:absolute; left:58px; top:24px; width:24px; height:92px; border-radius:12px; background:var(--theme-accent); }

    /* Bracket feet. */
    .foot { position:absolute; width:120px; height:44px; background:var(--theme-accent); z-index:2; }
    .foot.tl { left:80px; top:160px; transform-origin:0 50%; }
    .foot.bl { left:80px; top:906px; transform-origin:0 50%; }
    .foot.tr { left:880px; top:160px; transform-origin:100% 50%; }
    .foot.br { left:880px; top:906px; transform-origin:100% 50%; }

    /* Repo header: brand, star, visibility toggle. */
    .brand { position:absolute; left:80px; top:60px; width:640px; height:72px; font-size:56px; line-height:72px; white-space:nowrap; visibility:hidden; z-index:5; }
    .star { position:absolute; left:772px; top:66px; width:60px; height:60px; background:var(--theme-accent2); clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%); z-index:5; }
    .toggle { position:absolute; left:856px; top:60px; width:144px; height:72px; border-radius:36px; background:var(--theme-surface); overflow:hidden; z-index:5; }
    .tfill { position:absolute; inset:0; background:var(--theme-accent); }
    .knob { position:absolute; left:10px; top:10px; width:52px; height:52px; border-radius:50%; background:var(--theme-foreground); }

    /* Announcement. */
    .hlwrap { position:absolute; inset:0; z-index:5; }
    .headline { position:absolute; left:160px; top:190px; width:760px; height:470px; font-size:150px; line-height:.95; align-content:center; visibility:hidden; }
    .rule { position:absolute; left:160px; top:684px; width:760px; height:14px; background:var(--theme-accent2); transform-origin:0 50%; }
    .slash { position:absolute; top:744px; width:26px; height:52px; background:var(--theme-accent2); clip-path:polygon(45% 0,100% 0,55% 100%,0 100%); z-index:5; }
    .slash.a { left:160px; }
    .slash.b { left:190px; }
    .subhead { position:absolute; left:236px; top:734px; width:684px; height:200px; font-size:52px; line-height:1.25; font-weight:500; visibility:hidden; z-index:5; }

    /* Address bar. */
    .chev { position:absolute; left:118px; top:552px; width:40px; height:56px; background:var(--theme-background); clip-path:polygon(0 0,32% 0,100% 50%,32% 100%,0 100%,68% 50%); z-index:5; }
    .cta { position:absolute; left:186px; top:460px; width:774px; height:240px; font-size:96px; line-height:1; font-weight:700; white-space:nowrap; color:var(--theme-background); align-content:center; visibility:hidden; z-index:5; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1080">
    <section id="opensource-main" class="scene" data-start="0" data-duration="8" data-track-index="0">
      <div class="shackle" data-layout-allow-overflow></div>
      <div class="half l">
        <div class="code">
          <div class="ln" style="left:0;top:330px;width:190px"></div>
          <div class="ln" style="left:44px;top:372px;width:328px"></div>
          <div class="ln" style="left:44px;top:414px;width:236px"></div>
          <div class="ln" style="left:0;top:456px;width:104px"></div>
        </div>
      </div>
      <div class="half r">
        <div class="code">
          <div class="ln" style="left:0;top:372px;width:156px"></div>
        </div>
      </div>
      <div class="seam"></div>
      <div class="cyl"><div class="slot"></div></div>
      <div class="foot tl"></div><div class="foot bl"></div><div class="foot tr"></div><div class="foot br"></div>

      <div class="brand display" data-fit-max="56" data-fit-min="36" data-text-role="brand" data-beat-text="brand">Brand</div>
      <div class="star"></div>
      <div class="toggle"><div class="tfill"></div><div class="knob"></div></div>

      <div class="hlwrap">
        <h1 class="headline display fit" data-fit-max="150" data-fit-min="88" data-text-role="headline" data-beat-text="headline">Headline</h1>
        <div class="rule"></div>
      </div>
      <div class="slash a"></div><div class="slash b"></div>
      <p class="subhead mono fit" data-fit-max="52" data-fit-min="34" data-text-role="subhead" data-beat-text="subhead">Subhead</p>

      <div class="chev"></div>
      <div class="cta mono" data-fit-max="96" data-fit-min="44" data-text-role="cta" data-beat-text="cta">CTA</div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const brand = q('.brand'), headline = q('.headline'), subhead = q('.subhead'), cta = q('.cta');
      const L = q('.half.l'), R = q('.half.r');

      // Words rise through masks on eighth notes; later words share the last slot so long text settles early.
      const words = (el, start, cap = 2, dur = 0.75) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 125}, {yPercent: 0, duration: B(dur), ease: 'expo.out'}, start + Math.min(i, cap) * B(0.5)));
      const drop = (el, at) => tl.fromTo(m.spans(el), {yPercent: 0},
        {yPercent: 125, duration: B(0.4), ease: 'power3.in', immediateRender: false}, at);
      const vis = (el, v, at) => tl.set(el, {visibility: v ? 'visible' : 'hidden'}, at);
      const morph = (el, from, to, at, dur, ease) =>
        tl.fromTo(el, {...from}, {...to, duration: B(dur), ease, immediateRender: false}, at);

      // Lock-body, bracket, and full-width address-bar shapes of the two halves.
      const bodyL = {left: 120, top: 460, width: 420, height: 500}, bodyR = {left: 540, top: 460, width: 420, height: 500};
      const brL = {left: 80, top: 160, width: 44, height: 790}, brR = {left: 956, top: 160, width: 44, height: 790};
      const barL = {left: 80, top: 460, width: 460, height: 240}, barR = {left: 540, top: 460, width: 460, height: 240};

      // Beat 0: the key turns the cylinder.
      tl.fromTo('.cyl', {rotation: 0, scale: 1}, {rotation: 90, duration: B(0.75), ease: 'expo.out'}, t('keyTurn'));

      // Beat 1: brand rises in the repo header.
      vis(brand, true, t('brand'));
      words(brand, t('brand'), 1);

      // Beat 2: the visibility toggle flips to public.
      tl.fromTo('.knob', {x: 0}, {x: 72, duration: B(0.5), ease: 'expo.out'}, t('toggle'));
      tl.fromTo('.tfill', {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, t('toggle'));

      // Beat 3: the shackle pops free and a seam splits the body.
      tl.fromTo('.shackle', {y: 0}, {y: -90, duration: B(0.75), ease: 'back.out(1.2)', immediateRender: false}, t('unlock'));
      tl.fromTo('.seam', {scaleY: 0}, {scaleY: 1, duration: B(0.6), ease: 'expo.out'}, t('unlock'));

      // Beat 4: the shackle leaves, the cylinder collapses, the halves slice apart into brackets.
      tl.fromTo('.shackle', {y: -90}, {y: -780, duration: B(0.5), ease: 'power3.in', immediateRender: false}, t('open'));
      tl.fromTo('.cyl', {scale: 1}, {scale: 0, duration: B(0.3), ease: 'power3.in', immediateRender: false}, t('open'));
      morph(L, bodyL, brL, t('open'), 1, 'power4.out');
      morph(R, bodyR, brR, t('open'), 1, 'power4.out');
      vis('.seam', false, B(4.5));

      // Beat 5: the headline rises between the brackets.
      vis(headline, true, t('headline'));
      words(headline, t('headline'));

      // Beat 6: bracket feet snap out.
      tl.fromTo('.foot', {scaleX: 0}, {scaleX: 1, duration: B(0.6), ease: 'expo.out'}, t('feet'));

      // Beat 7: the rule draws short; beat 10: it extends full width.
      tl.fromTo('.rule', {scaleX: 0, transformOrigin: '0% 50%'}, {scaleX: 0.24, duration: B(0.6), ease: 'expo.out'}, t('rule'));
      tl.fromTo('.rule', {scaleX: 0.24, transformOrigin: '0% 50%'}, {scaleX: 1, duration: B(0.75), ease: 'expo.out', immediateRender: false}, t('ruleExtend'));

      // Beat 8: the headline lifts to make room.
      tl.fromTo('.hlwrap', {y: 60}, {y: 0, duration: B(1), ease: 'expo.out'}, t('lift'));

      // Beat 9: comment slashes, then the subhead lands on beats 9 and 9.5.
      tl.fromTo('.slash.a', {scaleY: 0, transformOrigin: '50% 100%'}, {scaleY: 1, duration: B(0.5), ease: 'expo.out'}, t('subhead'));
      tl.fromTo('.slash.b', {scaleY: 0, transformOrigin: '50% 100%'}, {scaleY: 1, duration: B(0.5), ease: 'expo.out'}, t('subhead') + B(0.25));
      vis(subhead, true, t('subhead'));
      words(subhead, t('subhead'), 1);

      // Beat 11: feet retract; beat 11.25: headline and rule leave.
      tl.fromTo('.foot', {scaleX: 1}, {scaleX: 0, duration: B(0.4), ease: 'power3.in', immediateRender: false}, t('feetRetract'));
      drop(headline, B(11.25));
      tl.fromTo('.rule', {scaleX: 1, transformOrigin: '100% 50%'}, {scaleX: 0, duration: B(0.4), ease: 'power3.in', immediateRender: false}, B(11.25));
      vis(headline, false, t('slam'));

      // Beats 11.5-12: the brackets accelerate inward and slam into the address bar exactly on beat 12.
      morph(L, brL, barL, t('slam') - B(0.5), 0.5, 'power3.in');
      morph(R, brR, barR, t('slam') - B(0.5), 0.5, 'power3.in');
      tl.fromTo([L, R], {scaleY: 1.06, transformOrigin: '50% 50%'}, {scaleY: 1, duration: B(0.5), ease: 'expo.out', immediateRender: false}, t('slam'));
      vis(cta, true, t('slam'));
      words(cta, t('slam'), 1, 0.6);
      tl.fromTo('.chev', {scale: 0}, {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('slam'));

      // Beats 12.5-13: the shackle falls back in and lands above the bar, unlocked.
      tl.fromTo('.shackle', {y: -780}, {y: -90, duration: B(0.5), ease: 'power3.in', immediateRender: false}, t('shackleReturn') - B(0.5));
      tl.set('.hlwrap', {y: 60}, t('shackleReturn'));

      // Beat 14: the first star.
      tl.fromTo('.star', {scale: 0}, {scale: 1, duration: B(0.6), ease: 'back.out(1.2)'}, t('star'));

      // Beat 15: text drops, toggle returns to private, the bar becomes the lock body, the shackle clicks shut.
      const c = t('close');
      drop(brand, c); drop(subhead, c); drop(cta, c);
      tl.fromTo('.chev', {scale: 1}, {scale: 0, duration: B(0.4), ease: 'power3.in', immediateRender: false}, c);
      tl.fromTo('.slash', {scaleY: 1}, {scaleY: 0, duration: B(0.4), ease: 'power3.in', immediateRender: false}, c);
      tl.fromTo('.star', {scale: 1}, {scale: 0, duration: B(0.4), ease: 'power3.in', immediateRender: false}, c);
      tl.fromTo('.knob', {x: 72}, {x: 0, duration: B(0.5), ease: 'expo.out', immediateRender: false}, c);
      tl.fromTo('.tfill', {clipPath: 'inset(0% 0% 0% 0%)'}, {clipPath: 'inset(0% 100% 0% 0%)', duration: B(0.5), ease: 'expo.out', immediateRender: false}, c);
      vis([brand, subhead, cta], false, B(15.5));
      morph(L, barL, bodyL, B(15.5), 0.4, 'expo.out');
      morph(R, barR, bodyR, B(15.5), 0.4, 'expo.out');
      tl.set('.cyl', {rotation: 0}, B(15.25));
      tl.fromTo('.cyl', {scale: 0}, {scale: 1, duration: B(0.4), ease: 'expo.out', immediateRender: false}, B(15.5));
      tl.fromTo('.shackle', {y: -90}, {y: 0, duration: B(0.375), ease: 'power2.in', immediateRender: false}, B(15.5));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
