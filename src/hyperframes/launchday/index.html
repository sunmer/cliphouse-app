<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }
    .layer { position:absolute; inset:0; }
    .s2, .s3 { visibility:hidden; }

    /* The dial: surface track with four quarter ticks. */
    .track { position:absolute; left:120px; top:160px; width:840px; height:840px; border-radius:50%; background:var(--theme-surface); transform-origin:50% 50%; }
    .ticks { position:absolute; inset:0; transform-origin:50% 50%; }
    .tick { position:absolute; display:block; left:413px; top:22px; width:14px; height:56px; background:var(--theme-accent); transform-origin:7px 398px; }

    /* The carrier: a fixed 2600px square centered on the dial. Its rounded inset clip is the shape
       (pie, live dot, flood, card, button), and the inner pie clip drains the countdown. Nothing reflows. */
    .carrier { position:absolute; left:-760px; top:-720px; width:2600px; height:2600px;
      clip-path:inset(980px 980px 980px 980px round 320px); }
    .pie { position:absolute; inset:0; background:var(--theme-accent2);
      clip-path:polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%); }
    .hub { position:absolute; left:465px; top:505px; width:150px; height:150px; border-radius:50%; background:var(--theme-accent); transform-origin:50% 50%; }

    .brand { position:absolute; left:80px; top:80px; width:700px; height:64px; font-size:52px; line-height:1.1; text-transform:uppercase; white-space:nowrap; color:var(--theme-foreground); }

    /* Em padding keeps the mask padding inside each box, so the fit helper measures true overflow. */
    .date { position:absolute; left:120px; top:470px; width:840px; height:260px; padding:.1em 0; font-size:140px; line-height:.95; text-align:center; align-content:center; color:var(--theme-accent); }
    .drule { position:absolute; left:440px; top:770px; width:200px; height:14px; background:var(--theme-accent); transform-origin:50% 50%; }

    .hrule { position:absolute; left:80px; top:210px; width:920px; height:16px; background:var(--theme-accent); transform-origin:0% 50%; }
    .headline { position:absolute; left:80px; top:260px; width:920px; height:460px; padding-bottom:.1em; font-size:170px; line-height:.9; align-content:end; color:var(--theme-accent); }
    .subhead { position:absolute; left:80px; top:750px; width:920px; height:210px; font-size:60px; line-height:1.12; font-weight:600; color:var(--theme-accent); }

    .ctaLayer { position:absolute; left:80px; top:450px; width:920px; height:280px; transform-origin:50% 50%; }
    .cta { position:absolute; left:150px; top:30px; width:700px; height:220px; padding:.1em 0; font-size:96px; line-height:.98; text-align:center; align-content:center; color:var(--theme-accent); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="8.667" data-width="1080" data-height="1080">
    <section id="launchday-main" class="scene" data-start="0" data-duration="8.667" data-track-index="0">
      <div class="track">
        <div class="ticks">
          <i class="tick" style="transform:rotate(0deg)"></i>
          <i class="tick" style="transform:rotate(90deg)"></i>
          <i class="tick" style="transform:rotate(180deg)"></i>
          <i class="tick" style="transform:rotate(270deg)"></i>
        </div>
      </div>
      <div class="layer s1">
        <div class="date display fit" data-fit-max="140" data-fit-min="64" data-text-role="date" data-beat-text="date">Date</div>
        <div class="drule"></div>
      </div>
      <div class="carrier" data-layout-allow-overflow><div class="pie" data-layout-allow-overflow></div></div>
      <div class="hub"></div>
      <div class="layer s2">
        <div class="hrule"></div>
        <h1 class="headline display fit" data-fit-max="170" data-fit-min="60" data-text-role="headline" data-beat-text="headline">Headline</h1>
        <p class="subhead fit" data-fit-max="60" data-fit-min="36" data-text-role="subhead" data-beat-text="subhead">Subhead</p>
      </div>
      <div class="layer s3">
        <div class="ctaLayer">
          <div class="cta display fit" data-fit-max="96" data-fit-min="52" data-text-role="cta" data-beat-text="cta">CTA</div>
        </div>
      </div>
      <div class="brand display" data-fit-max="52" data-fit-min="36" data-text-role="brand" data-beat-text="brand">Brand</div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      // Kinetic type: words rise through masks; later words share the second slot so long text settles early.
      const words = (el, start, cap = 1) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 125}, {yPercent: 0, duration: B(0.75), ease: 'expo.out'}, start + Math.min(i, cap) * B(0.5)));
      const out = (el, at) => tl.to(m.spans(el), {yPercent: 125, duration: B(0.375), ease: 'power2.in'}, at);

      // Carrier shapes as frame boxes (left, top, width, height, radius), written as the rounded inset clip
      // of the fixed 2600px carrier square, which sits at -760, -720 in the frame. Paint only, never layout.
      const ins = (L, T, W, H, r) => `inset(${T + 720}px ${2600 - (L + 760 + W)}px ${2600 - (T + 720 + H)}px ${L + 760}px round ${r}px)`;
      const DIAL = ins(220, 260, 640, 640, 320);
      const DOT = ins(485, 525, 110, 110, 55);
      const DOT_UP = ins(485, 315, 110, 110, 55);
      const PULSE = ins(470, 300, 140, 140, 70);
      const FLOOD = ins(-380, -550, 1840, 1840, 920);
      const FULL = ins(0, 0, 1080, 1080, 0);
      const CARD = ins(40, 40, 1000, 1000, 0);
      const CARD_R = ins(40, 40, 1000, 1000, 80);
      const BUTTON = ins(80, 450, 920, 280, 140);
      const STAMP = ins(24.8, 433.2, 1030.4, 313.6, 156.8);
      // Every shape change is an explicit from-to, so GSAP never reads a normalized computed clip-path.
      const shape = (from, to, at, dur, ease = 'expo.out') =>
        tl.fromTo('.carrier', {clipPath: from}, {clipPath: to, duration: dur, ease, immediateRender: false}, at);
      const ft = (sel, from, to, at, dur, ease = 'expo.out') =>
        tl.fromTo(sel, from, {...to, duration: dur, ease, immediateRender: false}, at);

      // Pie states, relative to the dial center: the remaining time runs clockwise back to 12 o'clock.
      const P = [
        'polygon(50% 50%, 50% 0%, 100% 0%, 100% 100%, 0% 100%, 0% 0%, 50% 0%)',
        'polygon(50% 50%, 100% 50%, 100% 50%, 100% 100%, 0% 100%, 0% 0%, 50% 0%)',
        'polygon(50% 50%, 50% 100%, 50% 100%, 50% 100%, 0% 100%, 0% 0%, 50% 0%)',
        'polygon(50% 50%, 0% 50%, 0% 50%, 0% 50%, 0% 50%, 0% 0%, 50% 0%)',
      ];
      // The bullet sits in the pill's rounded left end.
      const BULLET = {x: -375, y: 10};

      // Frame 0 is the loop frame: the full pie, dark hub at center, upright ticks, full track, white brand.
      tl.set('.carrier', {clipPath: DIAL}, 0);
      tl.set('.pie', {clipPath: P[0]}, 0);
      tl.set('.hub', {x: 0, y: 0, scale: 1}, 0);
      tl.set('.track', {scale: 1}, 0);
      tl.set('.ticks', {rotation: 0}, 0);
      tl.set('.brand', {color: 'var(--theme-foreground)'}, 0);

      // Beats 0-2: the countdown. One quarter drains per beat: 3, 2, 1.
      ['tick3', 'tick2', 'tick1'].forEach((id, i) => ft('.pie', {clipPath: P[i]}, {clipPath: P[i + 1]}, t(id), B(0.6)));

      // Beat 3: zero. The last quarter collapses into the live dot, swallows the hub, and the ticks turn aside.
      shape(DIAL, DOT, t('zero'), B(0.6));
      ft('.pie', {clipPath: P[3]}, {clipPath: P[0]}, t('zero'), B(0.6));
      ft('.hub', {scale: 1}, {scale: 0}, t('zero'), B(0.5));
      ft('.ticks', {rotation: 0}, {rotation: 45}, t('zero'), B(0.75));

      // Beats 4-7: the dot lifts off the date, the rule draws, the dot blinks, the track charges.
      shape(DOT, DOT_UP, t('date'), B(0.75));
      words(q('.date'), t('date'));
      tl.fromTo('.drule', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('dateRule'));
      shape(PULSE, DOT_UP, t('pulse'), B(0.75));
      ft('.track', {scale: 1}, {scale: 0.94}, t('charge'), B(0.75));

      // Beat 8: zoom-through. The live dot grows past the farthest corner (about 10 frames) and becomes the stage.
      shape(DOT_UP, FLOOD, t('flood'), B(0.8), 'power3.out');
      tl.set('.brand', {color: 'var(--theme-accent)'}, t('flood') + B(0.25));
      tl.set('.s1', {visibility: 'hidden'}, t('headline'));
      tl.set('.s2', {visibility: 'visible'}, t('headline'));
      // Under full cover the circle becomes the same field as a hard-edged square, and the track hides.
      tl.set('.carrier', {clipPath: FULL}, B(9));
      tl.set('.track', {scale: 0}, B(10));

      // Beats 8.5-13: headline, rule, subhead, rule run, card step, rounded corners.
      words(q('.headline'), t('headline'));
      tl.fromTo('.hrule', {scaleX: 0}, {scaleX: 0.24, duration: B(0.75), ease: 'expo.out'}, t('rule'));
      words(q('.subhead'), t('subhead'));
      ft('.hrule', {scaleX: 0.24}, {scaleX: 1}, t('ruleRun'), B(0.75));
      shape(FULL, CARD, t('card'), B(0.75));
      shape(CARD, CARD_R, t('cardRound'), B(0.6));

      // Beat 13.625: the copy drops out through its masks before the card contracts.
      const exitAt = t('button') - B(0.375);
      out(q('.headline'), exitAt);
      out(q('.subhead'), exitAt);
      tl.set('.hrule', {transformOrigin: '100% 50%'}, exitAt);
      ft('.hrule', {scaleX: 1}, {scaleX: 0}, exitAt, B(0.375), 'power2.in');

      // Beat 14: the card contracts into the CTA button while the dial track regrows behind it.
      shape(CARD_R, BUTTON, t('button'), B(0.8));
      ft('.track', {scale: 0}, {scale: 1}, t('button'), B(0.8));
      tl.set('.brand', {color: 'var(--theme-foreground)'}, t('button') + B(0.1));
      tl.set('.s3', {visibility: 'visible'}, t('button'));
      tl.set('.s2', {visibility: 'hidden'}, t('button') + B(0.5));

      // Beat 15: the stamp. The button and its copy land together.
      shape(STAMP, BUTTON, t('ctaStamp'), B(0.75));
      ft('.ctaLayer', {scale: 1.12}, {scale: 1}, t('ctaStamp'), B(0.75));
      words(q('.cta'), t('ctaStamp'));

      // Beats 16-18: the hub returns as the bullet, the ticks snap upright, the bullet blinks live.
      tl.set('.hub', BULLET, t('ctaStamp'));
      ft('.hub', {scale: 0}, {scale: 0.45}, t('bullet'), B(0.6), 'back.out(1.2)');
      ft('.ticks', {rotation: 45}, {rotation: 0}, t('ticks'), B(0.75));
      ft('.hub', {scale: 0.62}, {scale: 0.45}, t('blink'), B(0.6));

      // Beat 19: the CTA drops, and the button rounds back into the full pie with the hub at center.
      out(q('.cta'), t('loop') - B(0.25));
      shape(BUTTON, DIAL, t('loop'), B(0.75));
      ft('.hub', {...BULLET, scale: 0.45}, {x: 0, y: 0, scale: 1}, t('loop'), B(0.75));
      tl.set('.s3', {visibility: 'hidden'}, t('loop') + B(0.5));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
