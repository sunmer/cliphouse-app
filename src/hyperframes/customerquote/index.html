<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }
    /* The carrier: one accent field whose clip is the button, the bubble, and the button again. First-frame state is the CTA pill. */
    .bubble { position:absolute; inset:0; background:var(--theme-accent); clip-path:inset(700px 80px 80px 80px round 150px); z-index:1; }
    .quote { position:absolute; left:136px; top:200px; width:808px; height:556px; font-size:108px; line-height:1.02; font-weight:500; color:var(--theme-background); align-content:center; visibility:hidden; }
    .mark { position:absolute; left:80px; top:112px; width:144px; height:64px; display:flex; gap:16px; z-index:4; }
    .tear { width:64px; height:64px; background:var(--theme-accent2); border-radius:50% 0 50% 50%; }
    .tail { position:absolute; left:136px; top:864px; width:72px; height:40px; background:var(--theme-accent); clip-path:polygon(0 0, 100% 0, 0 100%); transform-origin:50% 0; z-index:1; }
    .avatar { position:absolute; left:92px; top:908px; width:88px; height:88px; border-radius:50%; background:var(--theme-accent2); z-index:2; }
    .avatar svg { position:absolute; left:0; top:0; width:88px; height:88px; }
    .check { fill:none; stroke:var(--theme-background); stroke-width:12; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:70; stroke-dashoffset:70; }
    .author { position:absolute; left:204px; top:884px; width:796px; height:116px; font-size:52px; line-height:1.08; font-weight:650; color:var(--theme-foreground); align-content:center; visibility:hidden; z-index:2; }
    .brand { position:absolute; left:80px; top:220px; width:920px; height:440px; font-size:240px; line-height:.92; color:var(--theme-foreground); align-content:center; z-index:2; }
    .cta { position:absolute; left:160px; top:760px; width:620px; height:180px; font-size:104px; line-height:1; color:var(--theme-background); align-content:center; z-index:3; }
    .arrow { position:absolute; left:820px; top:810px; width:96px; height:80px; z-index:3; }
    .arrow path { fill:none; stroke:var(--theme-background); stroke-width:12; stroke-linecap:round; stroke-linejoin:round; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="9.333" data-width="1080" data-height="1080">
    <section id="customerquote-stage" class="scene" data-start="0" data-duration="9.333" data-track-index="0">
      <div class="bubble">
        <blockquote class="quote serif fit" data-fit-max="112" data-fit-min="48" data-text-role="quote" data-beat-text="quote">Quote</blockquote>
      </div>
      <div class="tail"></div>
      <div class="avatar"><svg viewBox="0 0 112 112"><path class="check" d="M34 58 L50 74 L80 42" /></svg></div>
      <div class="author display fit" data-fit-max="52" data-fit-min="30" data-text-role="author" data-beat-text="author">Author</div>
      <div class="brand display fit" data-fit-max="240" data-fit-min="80" data-text-role="brand" data-beat-text="brand">Brand</div>
      <div class="cta display fit" data-fit-max="104" data-fit-min="48" data-text-role="cta" data-beat-text="cta">CTA</div>
      <svg class="arrow" viewBox="0 0 96 80"><path d="M8 40 H84 M56 14 L84 40 L56 66" /></svg>
      <div class="mark"><div class="tear"></div><div class="tear"></div></div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const quote = q('.quote'), author = q('.author'), brand = q('.brand'), cta = q('.cta');

      // Words rise through masks; exits lift them out the top of the same masks.
      // `first` marks the earliest tween on those spans, which renders its from state immediately.
      const rise = (el, at, first = true) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 115}, {yPercent: 0, duration: B(0.75), ease: 'expo.out', immediateRender: first}, at(i)));
      const leave = (el, at, first = false) => tl.fromTo(m.spans(el), {yPercent: 0},
        {yPercent: -115, duration: B(0.5), ease: 'power3.in', immediateRender: first}, at);
      // Explicit from and to states for every step; only the first tween of a property renders immediately.
      const step = (sel, from, to, at, beats, ease = 'expo.out', first = false) =>
        tl.fromTo(sel, from, {...to, duration: B(beats), ease, immediateRender: first}, at);
      const vis = (el, v, at) => tl.set(el, {visibility: v ? 'visible' : 'hidden'}, at);

      // Carrier shapes as clip insets (top right bottom left, rounded).
      const shape = (top, bottom, r) => `inset(${top}px 80px ${bottom}px 80px round ${r}px)`;
      const PILL = shape(700, 80, 150), OPEN = shape(80, 80, 56), LIFT = shape(80, 216, 56);
      // The button press scales label, arrow, and pill around the pill's centre (540, 850).
      const PRESS = {bubble: '540px 850px', cta: '380px 90px', arrow: '-280px 40px'};

      // Beat 0: the end card clears and the clicked button floods up into the speech bubble.
      leave(brand, t('open'), true);
      leave(cta, t('open'), true);
      vis(brand, false, B(0.5));
      vis(cta, false, B(0.5));
      step('.arrow', {clipPath: 'inset(0% 0% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 100%)'}, t('open'), 0.5, 'power3.in', true);
      step('.bubble', {clipPath: PILL}, {clipPath: OPEN}, t('open'), 1, 'expo.out', true);
      step('.mark', {x: 0, y: 0, rotation: 0, scale: 1, transformOrigin: '50% 50%'}, {x: 56}, t('open'), 1, 'expo.out', true);

      // Beats 1-5: quote words spread over eight eighth-note slots, so every beat lands words at any length.
      vis(quote, true, t('quote'));
      vis(quote, false, B(12.5));
      const qn = m.spans(quote).length;
      rise(quote, (i) => t('quote') + (qn > 1 ? Math.round(i * 8 / (qn - 1)) : 0) * B(0.5));

      // Beat 6: the opening mark travels to the bubble's end and turns into a closing mark.
      step('.mark', {x: 56, y: 0, rotation: 0}, {x: 720, y: 664, rotation: 180}, t('closeMark'), 1);

      // Beat 7: the bubble lifts and grows a tail toward the speaker.
      step('.bubble', {clipPath: OPEN}, {clipPath: LIFT}, t('lift'), 1);
      step('.tail', {scaleY: 0}, {scaleY: 1}, t('lift') + B(0.25), 0.75, 'expo.out', true);

      // Beat 8: the avatar lands on the tail tip and the author rises beside it.
      step('.avatar', {scale: 0, transformOrigin: '50% 50%'}, {scale: 1}, t('author'), 0.75, 'back.out(1.2)', true);
      vis(author, true, t('author'));
      vis(author, false, B(12.5));
      rise(author, (i) => t('author') + Math.min(i, 1) * B(0.5));

      // Beat 10: the verified check draws inside the avatar.
      step('.check', {strokeDashoffset: 70}, {strokeDashoffset: 0}, t('verify'), 0.75, 'expo.out', true);

      // Beat 11: the closing mark stamps shut and the bubble breathes in from its tail corner.
      step('.mark', {scale: 1.5}, {scale: 1}, t('breath'), 0.75);
      step('.bubble', {scale: 1, transformOrigin: '80px 864px'}, {scale: 0.96}, t('breath'), 1, 'expo.out', true);

      // Beat 12: the bubble folds back into the button; quote, author, tail, and avatar leave; the mark flies home.
      step('.bubble', {clipPath: LIFT, scale: 0.96}, {clipPath: PILL, scale: 1}, t('fold'), 1);
      leave(quote, t('fold'));
      leave(author, t('fold'));
      step('.tail', {scaleY: 1}, {scaleY: 0}, t('fold'), 0.5, 'power3.in');
      step('.avatar', {scale: 1}, {scale: 0}, t('fold'), 0.5, 'power3.in');
      step('.mark', {x: 720, y: 664, rotation: 180}, {x: 0, y: 0, rotation: 180}, t('fold'), 1);

      // Beat 12.5: the brand rises above the folded button.
      vis(brand, true, t('brand'));
      rise(brand, (i) => t('brand') + Math.min(i, 1) * B(0.5), false);

      // Beat 13: the button winds up; beat 14: it stamps down as the CTA.
      step('.bubble', {scale: 1, transformOrigin: PRESS.bubble}, {scale: 1.08}, t('windup'), 0.75, 'power3.out');
      step('.bubble', {scale: 1.08}, {scale: 1}, t('ctaStamp'), 1);
      vis(cta, true, t('ctaStamp'));
      rise(cta, (i) => t('ctaStamp') + Math.min(i, 1) * B(0.5), false);

      // Beats 15-17: the arrow wipes on, the mark turns back into an opening mark, the arrow steps forward.
      step('.arrow', {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)'}, t('arrow'), 0.75);
      step('.mark', {rotation: 180}, {rotation: 360}, t('markTurn'), 0.75);
      step('.arrow', {x: 0}, {x: 20}, t('arrowStep'), 0.75, 'expo.out', true);

      // Beat 18: the whole button presses down like a click.
      step('.bubble', {scale: 1, transformOrigin: PRESS.bubble}, {scale: 0.94}, t('press'), 0.25, 'power2.out');
      step('.cta', {scale: 1, transformOrigin: PRESS.cta}, {scale: 0.94}, t('press'), 0.25, 'power2.out', true);
      step('.arrow', {scale: 1, transformOrigin: PRESS.arrow}, {scale: 0.94}, t('press'), 0.25, 'power2.out', true);

      // Beat 19: it releases and the arrow springs back: the full end card of the first frame.
      step('.bubble', {scale: 0.94}, {scale: 1}, t('release'), 0.75);
      step('.cta', {scale: 0.94}, {scale: 1}, t('release'), 0.75);
      step('.arrow', {scale: 0.94, x: 20}, {scale: 1, x: 0}, t('release'), 0.75);
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
