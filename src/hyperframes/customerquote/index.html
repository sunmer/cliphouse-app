<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:.06em .04em .1em; margin:-.06em 0 -.1em; }
    .w { display:inline-block; }
    .stage, .end { position:absolute; inset:0; }

    /* Marks: one glyph pair, three placements */
    .mark { position:absolute; width:228px; height:192px; }
    .mark svg { display:block; width:100%; height:100%; }
    .mark path { fill:currentColor; }
    .qopen { left:80px; top:80px; color:var(--theme-accent2); z-index:9; }
    .qclose { left:772px; top:808px; color:var(--theme-accent); z-index:3; }
    .qend { left:772px; top:808px; color:var(--theme-background); z-index:8; }
    .qclose svg, .qend svg { transform:rotate(180deg); }

    /* Quote scene: the quote hangs beside the opening mark */
    .quote { position:absolute; left:80px; top:80px; width:920px; height:660px; font-size:120px; line-height:1.04; font-weight:500; color:var(--theme-foreground); z-index:1; }
    .quote::before { content:""; float:left; width:260px; height:200px; }
    .band { position:absolute; left:0; top:770px; width:1080px; height:310px; background:var(--theme-surface); z-index:2; }
    .track, .fill { position:absolute; left:80px; top:806px; width:640px; height:14px; transform-origin:0 50%; z-index:3; }
    .track { background:color-mix(in srgb, var(--theme-foreground) 18%, transparent); }
    .fill { background:var(--theme-accent); }
    .badge { position:absolute; left:80px; top:862px; width:64px; height:64px; border-radius:50%; background:var(--theme-accent); z-index:3; }
    .badge svg { display:block; width:100%; height:100%; }
    .badge path { fill:none; stroke:var(--theme-background); stroke-width:7; stroke-linecap:square; stroke-dasharray:1; stroke-dashoffset:1; }
    .author { position:absolute; left:168px; top:850px; width:572px; height:140px; font-size:54px; line-height:1.12; font-weight:700; color:var(--theme-foreground); z-index:3; }

    /* Handoff and end screen */
    .flood2 { position:absolute; inset:0; background:var(--theme-accent); z-index:5; clip-path:circle(0px at 886px 904px); }
    .brand { position:absolute; left:80px; top:300px; width:920px; height:450px; padding-bottom:.14em; font-size:260px; line-height:.92; color:var(--theme-background); align-content:end; z-index:6; }
    .rule2 { position:absolute; left:80px; top:770px; width:920px; height:12px; background:var(--theme-accent2); transform-origin:0 50%; z-index:6; }
    .btn { position:absolute; left:80px; top:806px; width:920px; height:194px; background:var(--theme-accent2); z-index:7; clip-path:inset(0px 920px 180px 0px); }
    .ctatext { position:absolute; left:56px; top:22px; width:680px; height:150px; font-size:104px; line-height:.95; color:var(--theme-foreground); align-content:center; }
    .arrow { position:absolute; right:56px; top:57px; width:100px; height:80px; overflow:visible; }
    .arrow path { fill:none; stroke:var(--theme-foreground); stroke-width:13; stroke-linecap:butt; stroke-linejoin:miter; stroke-dasharray:1; stroke-dashoffset:1; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="9.333" data-width="1080" data-height="1080">
    <section id="customerquote-main" class="scene" data-start="0" data-duration="9.333" data-track-index="0">
      <div class="stage">
        <blockquote class="quote serif fit" data-fit-max="120" data-fit-min="48" data-text-role="quote" data-beat-text="quote">Quote</blockquote>
        <div class="band" data-layout-allow-overflow></div>
        <div class="track"></div>
        <div class="fill"></div>
        <div class="badge"><svg viewBox="0 0 64 64" aria-hidden="true"><path pathLength="1" d="M18 33L28 43L47 22"/></svg></div>
        <div class="author display fit" data-fit-max="54" data-fit-min="30" data-text-role="author" data-beat-text="author">Author</div>
        <div class="qclose mark"><svg viewBox="0 0 190 160" aria-hidden="true"><path d="M0 160V80L50 0H80L48 80H80V160Z"/><path d="M110 160V80L160 0H190L158 80H190V160Z"/></svg></div>
      </div>
      <div class="flood2" data-layout-allow-overflow></div>
      <div class="end">
        <div class="brand display fit" data-fit-max="260" data-fit-min="90" data-text-role="brand" data-beat-text="brand">Brand</div>
        <div class="rule2"></div>
      </div>
      <div class="btn">
        <div class="ctatext display fit" data-fit-max="104" data-fit-min="44" data-text-role="cta" data-beat-text="cta">CTA</div>
        <svg class="arrow" viewBox="0 0 100 80" aria-hidden="true"><path pathLength="1" d="M4 40H86M56 10L86 40L56 70"/></svg>
      </div>
      <div class="qend mark" data-layout-allow-overflow><svg viewBox="0 0 190 160" aria-hidden="true"><path d="M0 160V80L50 0H80L48 80H80V160Z"/><path d="M110 160V80L160 0H190L158 80H190V160Z"/></svg></div>
      <div class="qopen mark" data-layout-allow-overflow><svg viewBox="0 0 190 160" aria-hidden="true"><path d="M0 160V80L50 0H80L48 80H80V160Z"/><path d="M110 160V80L160 0H190L158 80H190V160Z"/></svg></div>
    </section>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const rise = (w, at) => tl.fromTo(w, {yPercent: 120}, {yPercent: 0, duration: B(0.75), ease: 'expo.out'}, at);
      // Words rise on eighth notes; later words share the last slot so long text settles early.
      const words = (el, start, cap) => m.spans(el).forEach((w, i) => rise(w, start + Math.min(i, cap) * B(0.5)));
      const pop = (sel, at) => tl.fromTo(sel, {scale: 0, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.75), ease: 'back.out(1.2)'}, at);

      // Beat 0: the full orange field collapses into the opening mark (its solid block covers the frame at scale 26).
      tl.fromTo('.qopen', {scale: 26, transformOrigin: '48px 150px'}, {scale: 1, duration: B(0.75), ease: 'power3.out'}, t('open'));
      // Beat 0.5: the signature track draws across the band.
      tl.fromTo('.track', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('open') + B(0.5));

      // Beats 1-4.5: quote words on eighth-note slots; long quotes group words so the last slot is beat 4.5.
      const qs = m.spans(q('.quote'));
      const slots = Math.max(qs.length, 8);
      qs.forEach((w, i) => rise(w, t('quote') + B(Math.floor(i * 8 / slots) * 0.5)));

      // Beats 2-5: the reading meter fills the signature line in quarter steps.
      [1, 2, 3, 4].forEach((k) => {
        const v = {scaleX: k / 4, duration: B(0.5), ease: 'expo.out'};
        if (k === 1) tl.fromTo('.fill', {scaleX: 0}, v, t('quote') + B(k));
        else tl.to('.fill', v, t('quote') + B(k));
      });

      // Beat 6: the full meter closes the quote. Beat 7: orange signs over the line.
      pop('.qclose', t('closeMark'));
      tl.fromTo('.btn', {clipPath: 'inset(0px 920px 180px 0px)'}, {clipPath: 'inset(0px 280px 180px 0px)', duration: B(0.75), ease: 'expo.out'}, t('signature'));

      // Beats 8-10: the author prints under the line, then the verified badge pops and its check draws.
      words(q('.author'), t('author'), 1);
      pop('.badge', t('badge'));
      tl.fromTo('.badge path', {strokeDashoffset: 1}, {strokeDashoffset: 0, duration: B(0.75), ease: 'expo.out'}, t('check'));

      // Beat 11: the closing mark winds up. Beat 12: it flips light and floods the frame blue from its center.
      tl.to('.qclose', {scale: 1.18, duration: B(0.75), ease: 'power3.out'}, t('windup'));
      tl.set('.qclose', {visibility: 'visible'}, 0);
      tl.set('.qclose', {visibility: 'hidden'}, t('closeFlood'));
      tl.set('.qend', {visibility: 'hidden'}, 0);
      tl.set('.qend', {visibility: 'visible'}, t('closeFlood'));
      tl.fromTo('.qend', {scale: 1.18, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.75), ease: 'expo.out'}, t('closeFlood'));
      tl.fromTo('.flood2', {clipPath: 'circle(0px at 886px 904px)'}, {clipPath: 'circle(1300px at 886px 904px)', duration: B(0.75), ease: 'power3.out'}, t('closeFlood'));
      const covered = t('closeFlood') + B(0.75);
      tl.set('.stage', {visibility: 'visible'}, 0);
      tl.set('.stage', {visibility: 'hidden'}, covered);
      tl.set('.end', {visibility: 'hidden'}, 0);
      tl.set('.end', {visibility: 'visible'}, covered);

      // Beat 13: the closing mark steps up to bracket the brand, which rises huge.
      tl.to('.qend', {y: -728, duration: B(0.75), ease: 'expo.out'}, t('brand'));
      words(q('.brand'), t('brand'), 2);

      // Beat 14: the signature line grows into the button, which stamps as the CTA lands.
      tl.set('.ctatext', {visibility: 'hidden'}, 0);
      tl.set('.ctatext', {visibility: 'visible'}, t('ctaStamp') - B(0.5));
      tl.to('.btn', {clipPath: 'inset(0px 0px 0px 0px)', duration: B(0.5), ease: 'power3.inOut'}, t('ctaStamp') - B(0.5));
      tl.set('.btn', {scale: 1.06, transformOrigin: '50% 50%'}, t('ctaStamp'));
      tl.to('.btn', {scale: 1, duration: B(0.75), ease: 'expo.out'}, t('ctaStamp'));
      words(q('.ctatext'), t('ctaStamp'), 1);

      // Beat 15: the arrow draws. Beat 16: the brand rule draws. Beats 17-18: the arrow nudges forward.
      tl.fromTo('.arrow path', {strokeDashoffset: 1}, {strokeDashoffset: 0, duration: B(0.75), ease: 'expo.out'}, t('arrow'));
      tl.fromTo('.rule2', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('brandRule'));
      [t('nudge'), t('nudgeAgain')].forEach((at) => {
        tl.to('.arrow', {x: 16, duration: B(0.25), ease: 'expo.out'}, at);
        tl.to('.arrow', {x: 0, duration: B(0.5), ease: 'power2.inOut'}, at + B(0.25));
      });

      // Beat 19: the opening mark swells back into the full orange field of frame 0.
      tl.to('.qopen', {scale: 26, duration: B(0.75), ease: 'power2.in'}, t('loopFlood'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
