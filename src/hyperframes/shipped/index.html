<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1920" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1920px; }
    /* Masks pad below for descenders without a negative margin, so fit boxes measure true height. */
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .1em; white-space:nowrap; }
    .w { display:inline-block; }
    .layer { position:absolute; inset:0; }
    .base { z-index:1; }
    .s2 { z-index:2; background:var(--theme-accent); clip-path:inset(1248px 1000px 240px 80px); }
    .wipe { z-index:3; background:var(--theme-background); clip-path:circle(0px at 270px 950px); }
    .top { z-index:4; }

    /* Deploy board */
    .rows { position:absolute; left:80px; top:248px; width:920px; }
    .row { position:relative; height:220px; margin-bottom:24px; background:var(--theme-surface); overflow:hidden; }
    .box { position:absolute; left:56px; top:56px; width:108px; height:108px; border:8px solid color-mix(in srgb, var(--theme-foreground) 30%, transparent); }
    .ln { position:absolute; left:220px; height:28px; background:color-mix(in srgb, var(--theme-foreground) 22%, transparent); }
    .l1 { top:70px; width:var(--a); }
    .l2 { top:122px; width:var(--b); }
    .rfill { position:absolute; inset:0; background:var(--theme-accent); clip-path:inset(0% 100% 0% 0%); }
    .rfill .ln { background:color-mix(in srgb, var(--theme-background) 45%, transparent); }
    .rfill svg { position:absolute; left:56px; top:56px; width:108px; height:108px; fill:none; stroke:var(--theme-background); stroke-linecap:square; stroke-linejoin:miter; }
    .ckp { stroke-dasharray:100; stroke-dashoffset:100; }
    .track { position:absolute; left:80px; top:1248px; width:920px; height:432px; background:var(--theme-surface); overflow:hidden; }
    .notch { position:absolute; top:0; bottom:0; width:8px; margin-left:-4px; background:var(--theme-background); }
    .ruler { position:absolute; left:80px; top:1728px; width:920px; height:72px; }
    .ruler i { position:absolute; top:0; width:6px; background:color-mix(in srgb, var(--theme-foreground) 30%, transparent); transform-origin:50% 0; }
    .s2 .ruler i { background:color-mix(in srgb, var(--theme-background) 30%, transparent); }
    .s2 .ruler.solid i { background:var(--theme-background); transform:scaleY(0); }

    /* Shipped field: headline, rule, stamp + subhead row, button, ruler */
    .hl { position:absolute; left:80px; top:248px; width:920px; height:452px; font-size:200px; line-height:.84; color:var(--theme-background); }
    .rule { position:absolute; left:80px; top:716px; width:920px; height:16px; background:var(--theme-background); transform-origin:0 50%; transform:scaleX(0); }
    .stamp { position:absolute; left:80px; top:760px; width:380px; height:380px; visibility:hidden; }
    .stamp svg { display:block; width:100%; height:100%; fill:none; stroke:var(--theme-background); stroke-linecap:square; stroke-linejoin:miter; }
    .sh { position:absolute; left:500px; top:760px; width:500px; height:400px; font-size:72px; line-height:1; font-weight:650; color:var(--theme-background); }
    .btn { position:absolute; left:80px; top:1248px; width:920px; height:432px; background:var(--theme-background); clip-path:inset(0% 100% 0% 0%); transform-origin:50% 50%; }
    .ck { position:absolute; top:156px; width:120px; height:120px; background:var(--theme-accent); transform:scale(0); }
    .ck svg { position:absolute; inset:0; width:100%; height:100%; fill:none; stroke:var(--theme-background); stroke-linecap:square; stroke-linejoin:miter; }
    .bfill { position:absolute; inset:0; background:var(--theme-accent2); transform-origin:0 50%; transform:scaleX(0); }
    .ct { position:absolute; left:60px; top:60px; width:800px; height:312px; font-size:150px; line-height:.9; text-align:center; align-content:center; color:var(--theme-background); }
    .cur { position:absolute; left:930px; top:1596px; width:72px; height:100px; transform-origin:0 0; }
    .cur svg { display:block; width:100%; height:100%; }
    .cur path { fill:var(--theme-foreground); stroke:var(--theme-background); stroke-width:5; stroke-linejoin:miter; }

    /* Top bar: always on top, the loop anchor */
    .chip { position:absolute; left:80px; top:96px; height:104px; display:flex; align-items:center; gap:20px; padding:0 32px 0 28px; background:var(--theme-surface); }
    .dot { flex:none; width:28px; height:28px; background:var(--theme-accent2); }
    .brand { display:block; max-width:440px; height:72px; font-size:60px; line-height:1; font-weight:700; white-space:nowrap; overflow:hidden; color:var(--theme-foreground); }
    .pips { position:absolute; right:80px; top:96px; height:104px; padding:0 28px; display:flex; align-items:center; gap:16px; background:var(--theme-surface); }
    .pip { position:relative; width:48px; height:48px; background:color-mix(in srgb, var(--theme-foreground) 18%, transparent); }
    .pf { position:absolute; inset:0; background:var(--theme-accent); transform:scale(0); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="7.467" data-width="1080" data-height="1920">
    <section id="shipped-deploy" class="layer base" data-start="0" data-duration="7.467" data-track-index="0">
      <div class="rows"></div>
      <div class="track"><i class="notch" style="left:25%"></i><i class="notch" style="left:50%"></i><i class="notch" style="left:75%"></i></div>
      <div class="ruler"></div>
    </section>

    <section id="shipped-field" class="layer s2" data-start="0" data-duration="7.467" data-track-index="1">
      <h1 class="hl display fit" data-fit-max="200" data-fit-min="90" data-text-role="headline" data-beat-text="headline">Headline</h1>
      <div class="rule"></div>
      <div class="stamp"><svg viewBox="0 0 100 100"><rect x="4" y="4" width="92" height="92" stroke-width="7"/><rect x="13" y="13" width="74" height="74" stroke-width="2.5"/><path d="M28 52 L44 68 L74 34" stroke-width="10"/></svg></div>
      <p class="sh fit" data-fit-max="72" data-fit-min="48" data-text-role="subhead" data-beat-text="subhead">Subhead</p>
      <div class="btn display">
        <div class="ck" style="left:55px"></div><div class="ck" style="left:285px"></div><div class="ck" style="left:515px"></div><div class="ck" style="left:745px"></div>
        <div class="bfill"></div>
        <div class="ct fit" data-fit-max="150" data-fit-min="64" data-text-role="cta" data-beat-text="cta">CTA</div>
      </div>
      <div class="ruler"></div>
      <div class="ruler solid"></div>
      <div class="cur"><svg viewBox="0 0 72 100"><path d="M4 4 L4 80 L24 62 L38 94 L52 88 L38 56 L64 56 Z"/></svg></div>
    </section>

    <div class="layer wipe" data-layout-allow-overflow>
      <div class="rows"></div>
      <div class="track"><i class="notch" style="left:25%"></i><i class="notch" style="left:50%"></i><i class="notch" style="left:75%"></i></div>
      <div class="ruler"></div>
    </div>

    <div class="layer top">
      <div class="chip"><span class="dot"></span><div class="brand mono" data-fit-max="60" data-fit-min="32" data-text-role="brand" data-beat-text="brand">Brand</div></div>
      <div class="pips"><div class="pip"><i class="pf"></i></div><div class="pip"><i class="pf"></i></div><div class="pip"><i class="pf"></i></div><div class="pip"><i class="pf"></i></div></div>
    </div>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    // Static decor: deploy rows and rulers. These are shapes only, no copy.
    (() => {
      const ROWS = [[600, 360], [520, 440], [660, 280], [480, 380]];
      const CHECK = '<svg viewBox="0 0 100 100"><rect x="5" y="5" width="90" height="90" stroke-width="9"/><path class="ckp" pathLength="100" d="M26 52 L43 69 L76 33" stroke-width="12"/></svg>';
      const TICK = '<svg viewBox="0 0 100 100"><path d="M26 52 L43 69 L76 33" stroke-width="12"/></svg>';
      const mk = (tag, cls, parent) => { const e = document.createElement(tag); e.className = cls; parent.append(e); return e; };
      const deck = (host, done) => {
        const rows = host.querySelector('.rows');
        ROWS.forEach(([a, b]) => {
          const row = mk('div', 'row', rows);
          row.style.setProperty('--a', a + 'px');
          row.style.setProperty('--b', b + 'px');
          mk('div', 'box', row); mk('i', 'ln l1', row); mk('i', 'ln l2', row);
          if (done) { const f = mk('div', 'rfill', row); f.innerHTML = CHECK; mk('i', 'ln l1', f); mk('i', 'ln l2', f); }
        });
      };
      deck(document.querySelector('.base'), true);
      deck(document.querySelector('.wipe'), false);
      for (const ruler of document.querySelectorAll('.ruler')) {
        for (let k = 0; k < 24; k++) {
          const i = mk('i', '', ruler);
          i.style.left = Math.round(k * 914 / 23) + 'px';
          i.style.height = (k % 4 === 0 ? 72 : 36) + 'px';
        }
      }
      for (const c of document.querySelectorAll('.s2 .ck')) c.innerHTML = TICK;
    })();

    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const qa = (s) => [...document.querySelectorAll(s)];
      // Words rise through masks on eighth notes; later words share the last slot so long text settles early.
      const words = (el, start, cap, dur = 0.75) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 125}, {yPercent: 0, duration: B(dur), ease: 'expo.out'}, start + Math.min(i, cap) * B(0.5)));

      // The green field is clipped to the track: its right inset is the progress bar.
      const RIGHT = [1000, 770, 540, 310, 80];
      const bar = (r) => `inset(1248px ${r}px 240px 80px)`;

      // Beats 0-3: each deploy step completes, the field's clip steps a quarter along the track, a pip pops.
      const fills = qa('.base .rfill');
      const checks = qa('.base .rfill .ckp');
      const pips = qa('.top .pf');
      ['step1', 'step2', 'step3', 'step4'].forEach((id, i) => {
        const at = t(id);
        tl.fromTo(fills[i], {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.5), ease: 'expo.out'}, at);
        tl.fromTo(checks[i], {strokeDashoffset: 100}, {strokeDashoffset: 0, duration: B(0.5), ease: 'power3.out'}, at + B(0.25));
        tl.fromTo(pips[i], {scale: 0}, {scale: 1, duration: B(0.5), ease: 'back.out(1.2)'}, at);
        tl.fromTo('.s2', {clipPath: bar(RIGHT[i])}, {clipPath: bar(RIGHT[i + 1]), duration: B(0.75), ease: 'expo.out', immediateRender: i === 0}, at);
      });

      // Beat 4: the full bar floods the screen from its own rectangle.
      tl.fromTo('.s2', {clipPath: bar(80)},
        {clipPath: 'inset(0px 0px 0px 0px)', duration: B(0.75), ease: 'power3.out', immediateRender: false}, t('flood'));

      // Beat 5: the stamp slams in the middle; the emptied bar slot redraws below it.
      tl.set('.stamp', {visibility: 'visible'}, t('shipped') - B(0.25));
      tl.fromTo('.stamp', {x: 270, y: -90, scale: 3.2, rotation: -15},
        {x: 270, y: -90, scale: 2.4, rotation: -8, duration: B(0.25), ease: 'power3.in'}, t('shipped') - B(0.25));
      tl.fromTo('.btn', {clipPath: 'inset(0% 100% 0% 0%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.75), ease: 'expo.out'}, t('shipped'));

      // Beat 6: the stamp steps down into the badge beside the subhead.
      tl.to('.stamp', {x: 0, y: 0, scale: 1, rotation: -6, duration: B(1), ease: 'expo.out'}, t('stampStep'));

      // Beats 6.5-9: headline, check squares, subhead, rule.
      words(q('.hl'), t('headline'), 1);
      qa('.s2 .ck').forEach((c, i) =>
        tl.fromTo(c, {scale: 0}, {scale: 1, duration: B(0.5), ease: 'back.out(1.2)'}, t('checks') + i * B(0.25)));
      words(q('.sh'), t('subhead'), 2);
      tl.fromTo('.rule', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('rule'));

      // Beats 10-11: a yellow progress fill loads the button; the solid ruler draws over the faint one.
      tl.fromTo('.bfill', {scaleX: 0}, {scaleX: 1, duration: B(1), ease: 'expo.out'}, t('fill'));
      const rt = qa('.s2 .ruler.solid i');
      rt.forEach((r, i) =>
        tl.fromTo(r, {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: 'expo.out'}, t('ruler') + (i / (rt.length - 1)) * B(0.5)));

      // Beat 12: the CTA slams into the button.
      words(q('.ct'), t('cta'), 0, 0.5);
      tl.fromTo('.btn', {scale: 1.08}, {scale: 1, duration: B(0.5), ease: 'expo.out'}, t('cta'));

      // Beat 13: the cursor arrives and clicks.
      tl.fromTo('.cur', {x: 220, y: 300}, {x: 0, y: 0, duration: B(0.75), ease: 'expo.out'}, t('click') - B(0.75));
      tl.fromTo('.cur', {scale: 0.8}, {scale: 1, duration: B(0.5), ease: 'power3.out', immediateRender: false}, t('click'));

      // Beat 14: the pips reset for the next deploy.
      pips.forEach((p, i) =>
        tl.to(p, {scaleX: 0, transformOrigin: '100% 50%', duration: B(0.5), ease: 'expo.out'}, t('reset') + i * B(0.25)));

      // Beat 15: the stamp badge floods dark back to the empty deploy board, matching frame 0.
      tl.fromTo('.wipe', {clipPath: 'circle(0px at 270px 950px)'},
        {clipPath: 'circle(1300px at 270px 950px)', duration: B(0.75), ease: 'power3.out'}, t('loopFlood'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
