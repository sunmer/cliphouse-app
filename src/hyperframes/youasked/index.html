<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1080px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; }

    /* Scene 1: the request card, clipped as one piece so it can regrow from the pill */
    .s1 { clip-path:circle(1140px at 232px 188px); }
    .card { position:absolute; left:80px; top:80px; width:920px; height:920px; background:var(--theme-surface); border-radius:28px; }
    .divider { position:absolute; left:144px; top:266px; width:792px; height:3px; background:var(--theme-foreground); opacity:.14; }
    .pillwrap { position:absolute; left:144px; top:144px; width:176px; height:88px; perspective:700px; }
    .pill { position:absolute; inset:0; transform-style:preserve-3d; }
    .face { position:absolute; inset:0; border-radius:44px; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:grid; place-items:center; }
    .open { background:var(--theme-accent); }
    .done { background:var(--theme-accent2); transform:rotateX(180deg); }
    .ring { width:48px; height:48px; border-radius:50%; border:7px solid var(--theme-foreground); display:grid; place-items:center; }
    .dot { width:14px; height:14px; border-radius:50%; background:var(--theme-foreground); }
    .tick { width:42px; height:21px; border-left:8px solid var(--theme-background); border-bottom:8px solid var(--theme-background); transform:translateY(-5px) rotate(-45deg); }
    .brand1 { position:absolute; left:352px; top:144px; width:584px; height:88px; font-size:52px; line-height:1.2; font-weight:700; white-space:nowrap; align-content:center; color:var(--theme-foreground); }
    .qbar { position:absolute; left:144px; top:312px; width:8px; height:392px; border-radius:4px; background:var(--theme-accent); }
    .quote { position:absolute; left:184px; top:304px; width:752px; height:408px; font-size:72px; line-height:1.12; font-weight:500; align-content:center; color:var(--theme-foreground); }
    .avatar { position:absolute; left:144px; top:744px; width:72px; height:72px; border-radius:50%; background:color-mix(in srgb, var(--theme-accent) 55%, var(--theme-surface)); }
    .author { position:absolute; left:240px; top:732px; width:520px; height:96px; font-size:34px; line-height:1.2; font-weight:600; align-content:center; color:var(--theme-foreground); }
    .vote { position:absolute; top:752px; width:56px; height:56px; border-radius:50%; border:5px solid var(--theme-surface); }
    .v1 { left:800px; background:var(--theme-accent2); }
    .v2 { left:840px; background:var(--theme-accent); }
    .v3 { left:880px; background:var(--theme-foreground); }
    .track { position:absolute; left:144px; top:892px; width:792px; height:8px; border-radius:4px; background:var(--theme-foreground); opacity:.14; }
    .fill { position:absolute; left:144px; top:892px; width:792px; height:8px; border-radius:4px; background:var(--theme-accent2); transform-origin:0 50%; }
    .node { position:absolute; top:882px; width:28px; height:28px; border-radius:50%; background:var(--theme-accent2); }

    /* Scene 2: shipped */
    .s2 { visibility:hidden; color:var(--theme-background); }
    .gflood { position:absolute; left:-1018px; top:-1062px; width:2500px; height:2500px; border-radius:50%; background:var(--theme-accent2); transform:scale(0); }
    .badge { position:absolute; left:144px; top:144px; width:176px; height:88px; border-radius:44px; background:var(--theme-background); display:grid; place-items:center; }
    .tick2 { width:42px; height:21px; border-left:8px solid var(--theme-accent2); border-bottom:8px solid var(--theme-accent2); transform:translateY(-5px) rotate(-45deg); }
    .brand2 { position:absolute; left:288px; top:80px; width:712px; height:88px; font-size:52px; line-height:1.2; font-weight:700; white-space:nowrap; align-content:center; color:var(--theme-background); }
    .headline { position:absolute; left:80px; top:200px; width:920px; height:360px; font-size:140px; line-height:.92; align-content:center; color:var(--theme-background); }
    .term { position:absolute; left:80px; top:600px; width:920px; height:400px; border-radius:24px; background:var(--theme-background); color:var(--theme-foreground); }
    .tdot { position:absolute; top:25px; width:14px; height:14px; border-radius:50%; background:var(--theme-foreground); opacity:.3; }
    .tline { position:absolute; left:0; top:64px; width:920px; height:2px; background:var(--theme-foreground); opacity:.1; }
    .chevwrap { position:absolute; left:44px; top:156px; width:56px; height:56px; display:grid; place-items:center; }
    .chev { width:30px; height:30px; border-top:9px solid var(--theme-accent2); border-right:9px solid var(--theme-accent2); transform:translateX(-6px) rotate(45deg); }
    .cta { position:absolute; left:120px; top:96px; width:752px; height:176px; font-size:88px; line-height:1.1; align-content:center; color:var(--theme-foreground); }
    .cursor { position:absolute; left:700px; top:140px; width:44px; height:80px; background:var(--theme-accent2); opacity:0; }
    .otrack { position:absolute; left:48px; top:323px; width:744px; height:10px; border-radius:5px; background:var(--theme-foreground); opacity:.15; }
    .ofill { position:absolute; left:48px; top:323px; width:744px; height:10px; border-radius:5px; background:var(--theme-accent2); transform-origin:0 50%; }
    .ok { position:absolute; left:816px; top:300px; width:56px; height:56px; border-radius:50%; background:var(--theme-accent2); display:grid; place-items:center; }
    .tick3 { width:24px; height:12px; border-left:6px solid var(--theme-background); border-bottom:6px solid var(--theme-background); transform:translateY(-3px) rotate(-45deg); }

    /* Loop flood from the terminal */
    .ret { position:absolute; left:-450px; top:-190px; width:1980px; height:1980px; border-radius:50%; background:var(--theme-background); transform:scale(0); z-index:5; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="9.333" data-width="1080" data-height="1080">
    <section id="youasked-request" class="scene s1 clip" data-start="0" data-duration="9.333" data-track-index="0">
      <div class="card"></div>
      <div class="divider"></div>
      <div class="pillwrap">
        <div class="pill">
          <div class="face open"><div class="ring"><div class="dot"></div></div></div>
          <div class="face done"><div class="tick"></div></div>
        </div>
      </div>
      <div class="brand1 mono fit" data-fit-max="52" data-fit-min="32" data-text-role="brand" data-beat-text="brand">Brand</div>
      <div class="qbar"></div>
      <blockquote class="quote serif fit" data-fit-max="72" data-fit-min="40" data-text-role="quote" data-beat-text="quote">Quote</blockquote>
      <div class="avatar"></div>
      <div class="author fit" data-fit-max="34" data-fit-min="30" data-text-role="author" data-beat-text="author">Author</div>
      <div class="vote v1"></div><div class="vote v2"></div><div class="vote v3"></div>
      <div class="track"></div>
      <div class="fill"></div>
      <div class="node" style="left:394px"></div>
      <div class="node" style="left:658px"></div>
      <div class="node" style="left:908px"></div>
    </section>
    <section id="youasked-shipped" class="scene s2" data-start="0" data-duration="9.333" data-track-index="1">
      <div class="gflood" data-layout-allow-overflow></div>
      <div class="badge"><div class="tick2"></div></div>
      <div class="brand2 mono fit" data-fit-max="52" data-fit-min="32" data-text-role="brand" data-beat-text="brand">Brand</div>
      <h1 class="headline display fit" data-fit-max="140" data-fit-min="84" data-text-role="headline" data-beat-text="headline">Headline</h1>
      <div class="term">
        <div class="tdot" style="left:36px"></div><div class="tdot" style="left:62px"></div><div class="tdot" style="left:88px"></div>
        <div class="tline"></div>
        <div class="chevwrap"><div class="chev"></div></div>
        <div class="cta mono fit" data-fit-max="88" data-fit-min="44" data-text-role="cta" data-beat-text="cta">CTA</div>
        <div class="cursor"></div>
        <div class="otrack"></div>
        <div class="ofill"></div>
        <div class="ok"><div class="tick3"></div></div>
      </div>
    </section>
    <div class="ret" data-layout-allow-overflow></div>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      // Words move through masks in at most `slots` groups on eighth notes, so long text settles early.
      const rise = (el, start, slots, from = 125) => {
        const ws = m.spans(el);
        const k = Math.max(1, Math.ceil(ws.length / slots));
        ws.forEach((w, i) => tl.fromTo(w, {yPercent: from}, {yPercent: 0, duration: B(0.75), ease: 'expo.out'}, start + Math.floor(i / k) * B(0.5)));
      };
      const pop = (el, at) => tl.fromTo(el, {scale: 0, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.75), ease: 'expo.out'}, at);

      // Layout that depends on fitted text: the quote bar matches the quote, the cursor follows the command.
      const place = () => {
        const quote = q('.quote'), bar = q('.qbar');
        const qm = quote ? quote.querySelectorAll('.wmask') : [];
        if (quote && bar && qm.length) {
          const fs = parseFloat(getComputedStyle(quote).fontSize) || 72;
          const top = qm[0].offsetTop, last = qm[qm.length - 1];
          const bottom = last.offsetTop + last.offsetHeight;
          bar.style.top = (quote.offsetTop + top + fs * 0.12) + 'px';
          bar.style.height = Math.max(fs, bottom - top - fs * 0.24) + 'px';
        }
        const cta = q('.cta'), cur = q('.cursor');
        if (!cta || !cur) return;
        const fs = parseFloat(getComputedStyle(cta).fontSize) || 88;
        const w = fs * 0.5, h = fs * 0.9;
        const masks = cta.querySelectorAll('.wmask');
        const last = masks[masks.length - 1];
        let x = cta.offsetLeft, y = cta.offsetTop + (cta.clientHeight - h) / 2;
        if (last) {
          x = cta.offsetLeft + last.offsetLeft + last.offsetWidth + fs * 0.12;
          y = cta.offsetTop + last.offsetTop + (last.offsetHeight - h) / 2;
        }
        x = Math.min(x, 920 - 40 - w);
        Object.assign(cur.style, {left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px'});
      };
      place();
      document.fonts?.ready.then(place);

      // Beat 0: the card is already readable. The open dot pops and the quote bar draws.
      pop('.dot', t('quote'));
      tl.fromTo('.qbar', {scaleY: 0, transformOrigin: '50% 0%'}, {scaleY: 1, duration: B(1), ease: 'expo.out'}, t('quote'));
      // Beats 1-2: avatar, then author.
      pop('.avatar', t('avatar'));
      rise(q('.author'), t('author'), 2);
      // Beats 3-4: others want it too.
      ['vote1', 'vote2', 'vote3'].forEach((id, i) => pop(document.querySelectorAll('.vote')[i], t(id)));

      // Beats 5-7: the rail fills in three commits.
      const nodes = document.querySelectorAll('.node');
      tl.fromTo('.fill', {scaleX: 0}, {scaleX: 1 / 3, duration: B(0.75), ease: 'expo.out'}, t('commit1'));
      tl.to('.fill', {scaleX: 2 / 3, duration: B(0.75), ease: 'expo.out'}, t('commit2'));
      tl.to('.fill', {scaleX: 1, duration: B(0.75), ease: 'expo.out'}, t('commit3'));
      ['commit1', 'commit2', 'commit3'].forEach((id, i) => pop(nodes[i], t(id)));

      // Beat 8: the pill flips from open to shipped and stamps.
      tl.to('.pill', {rotationX: 180, duration: B(0.75), ease: 'power3.out'}, t('flip'));
      tl.fromTo('.pillwrap', {scale: 1.15, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.75), ease: 'expo.out', immediateRender: false}, t('flip'));

      // Beat 9: green floods out of the shipped pill; the pill inverts into the dark badge.
      tl.set('.s2', {visibility: 'visible'}, t('flood'));
      tl.fromTo('.gflood', {scale: 0}, {scale: 1, duration: B(0.75), ease: 'power3.out'}, t('flood'));
      tl.set('.s1', {visibility: 'hidden'}, t('flood') + B(0.75));

      // Beat 10: the badge steps into the top-left corner; the brand rises beside it.
      tl.to('.badge', {x: -64, y: -64, duration: B(0.75), ease: 'expo.out'}, t('badge'));
      rise(q('.brand2'), t('finaleBrand'), 1);

      // Beats 10.5-11: the headline drops in with weight.
      rise(q('.headline'), t('headline'), 2, -125);
      tl.fromTo('.headline', {scale: 1.06, transformOrigin: '50% 50%'}, {scale: 1, duration: B(1), ease: 'expo.out'}, t('headline'));

      // Beat 12: the terminal's top edge draws. Beat 13: it opens.
      tl.fromTo('.term', {clipPath: 'inset(0px 100% 390px 0px round 8px)'}, {clipPath: 'inset(0px 0% 390px 0px round 8px)', duration: B(0.75), ease: 'expo.out'}, t('rule'));
      tl.to('.term', {clipPath: 'inset(0px 0% 0px 0px round 8px)', duration: B(0.75), ease: 'expo.out'}, t('terminal'));
      pop('.chevwrap', t('prompt'));

      // Beat 14: the command stamps into the terminal.
      rise(q('.cta'), t('ctaStamp'), 1);
      tl.fromTo('.term', {scale: 1.05, transformOrigin: '50% 50%'}, {scale: 1, duration: B(0.75), ease: 'expo.out', immediateRender: false}, t('ctaStamp'));

      // Beats 15-16: the output rail fills and the check pops. The cursor blinks on half beats.
      tl.fromTo('.ofill', {scaleX: 0}, {scaleX: 1, duration: B(1), ease: 'expo.out'}, t('output'));
      pop('.ok', t('check'));
      [14.5, 15, 15.5, 16, 16.5, 17, 17.5].forEach((b, i) => tl.set('.cursor', {opacity: i % 2 ? 0 : 1}, B(b)));

      // Beat 18: the terminal floods the frame in background color.
      tl.fromTo('.ret', {scale: 0}, {scale: 1, duration: B(0.75), ease: 'power3.out'}, t('loopFlood'));

      // Under the flood, everything returns to its first-frame state.
      const reset = t('loopFlood') + B(0.75);
      tl.set('.ret', {scale: 0}, reset);
      tl.set('.s2', {visibility: 'hidden'}, reset);
      tl.set('.s1', {visibility: 'visible', clipPath: 'circle(0px at 232px 188px)'}, reset);
      tl.set('.pill', {rotationX: 0}, reset);
      tl.set('.pillwrap', {scale: 0}, reset);
      tl.set(['.dot', '.avatar', '.vote', '.node'], {scale: 0}, reset);
      tl.set('.qbar', {scaleY: 0}, reset);
      tl.set('.fill', {scaleX: 0}, reset);
      tl.set(m.spans(q('.author')), {yPercent: 125}, reset);

      // Beat 19: the card regrows from the open pill with the quote in place, matching frame 0.
      tl.to('.s1', {clipPath: 'circle(1140px at 232px 188px)', duration: B(0.75), ease: 'power3.out'}, t('shell'));
      tl.to('.pillwrap', {scale: 1, duration: B(0.75), ease: 'expo.out'}, t('shell'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
