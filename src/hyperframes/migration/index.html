<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>__BASE_CSS__
:root { --w: 1920px; --h: 1080px; }

/* Route: one line, 90 and 45 degree bends only */
#track { position: absolute; inset: 0; }
#track path { fill: none; stroke-width: 36; stroke-linejoin: miter; stroke-linecap: butt; }
#track #ghost { stroke: var(--theme-surface); }
#track #live { stroke: var(--theme-accent); }

/* Terminus bars across both ends of the line */
.cap { position: absolute; background: var(--theme-surface); }
#capO { left: 146px; top: 322px; width: 108px; height: 36px; }
#capD { left: 1742px; top: 874px; width: 36px; height: 112px; }
.cap i { position: absolute; inset: 0; display: block; }
#capO i { background: var(--theme-foreground); }
#capD i { background: var(--theme-accent); }

/* Stations: rows on the trunk reflow with --count */
#stops, #rows { position: absolute; inset: 0; }
#rows {
  --n: var(--count, 4);
  --rh: min(calc(480px / var(--n)), 160px);
  --y0: calc(400px + (480px - var(--rh) * var(--n)) / 2);
}
.stop {
  position: absolute; left: 158px; width: 84px; height: 84px; border-radius: 50%;
  background: var(--theme-background); border: 10px solid var(--theme-foreground);
}
.row { position: absolute; left: 158px; top: calc(var(--y0) + var(--rh) * var(--i)); width: 1562px; height: var(--rh); }
.fill {
  position: absolute; left: 0; top: calc(50% - 42px); width: 84px; height: 84px; border-radius: 50%;
  background: var(--theme-accent2); overflow: hidden; display: grid; place-items: center;
}
.seal { position: absolute; inset: 0; border-radius: 50%; background: var(--theme-accent); }
.num { position: relative; font-weight: 800; font-size: 34px; line-height: 1; color: var(--theme-background); font-variant-numeric: tabular-nums; }
.label {
  position: absolute; left: 162px; top: calc(50% - 48px); width: 1400px; height: 96px;
  display: flex; align-items: center; white-space: nowrap;
  font-weight: 600; line-height: 1; color: var(--theme-foreground);
}
.label > span { white-space: nowrap; }

/* The carrier: a route marker that rides the same path as the line */
#marker {
  position: absolute; left: 0; top: 0; width: 0; height: 0;
  offset-path: path("M200 340 V850 L280 930 H1760");
  offset-rotate: 0deg;
  offset-distance: calc(var(--d, 0) * 1px);
}
.pill {
  position: absolute; right: -56px; top: -56px; width: 860px; height: 112px; border-radius: 56px;
  background: var(--theme-accent);
  clip-path: inset(0 0 0 calc(var(--pw, 860) * 1px) round 56px);
}
.body { position: absolute; left: -28px; top: -28px; width: 56px; height: 56px; border-radius: 50%; background: var(--theme-foreground); }
.eye { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%; background: var(--theme-background); }
.chev {
  position: absolute; left: -13px; top: -9px; width: 18px; height: 18px;
  border-top: 6px solid var(--theme-background); border-right: 6px solid var(--theme-background);
}

/* Type */
#headline { position: absolute; left: 120px; top: 60px; width: 1680px; height: 220px; line-height: 0.95; color: var(--theme-foreground); }
#headline .w { color: color-mix(in srgb, var(--theme-accent) calc(var(--hot, 0) * 100%), var(--theme-foreground)); }
#brand { position: absolute; left: 320px; top: 292px; width: 820px; height: 96px; display: flex; align-items: center; line-height: 1; color: var(--theme-foreground); }
#cta { position: absolute; left: 1000px; top: 874px; width: 680px; height: 112px; display: flex; align-items: center; line-height: 1; color: var(--theme-background); }
#brand > span, #cta > span { white-space: nowrap; }
.wmask { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.08em 0 0.14em; margin: -0.08em 0 -0.14em; }
.w { display: inline-block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="11.2" data-width="1920" data-height="1080">
  <div id="map" class="scene">
    <svg id="track" width="1920" height="1080" viewBox="0 0 1920 1080">
      <path id="ghost" d="M200 340 V850 L280 930 H1760"/>
      <path id="live" d="M200 340 V850 L280 930 H1760"/>
    </svg>
    <div id="capO" class="cap"><i></i></div>
    <div id="capD" class="cap"><i></i></div>
    <div id="stops"></div>
    <div id="rows" data-list>
      <template data-list-row>
        <div class="row">
          <div class="fill" data-list-part="fill" data-list-align="y">
            <div class="seal" data-list-part="seal" data-list-group="finale" data-list-align="y"></div>
            <span class="num" data-list-number></span>
          </div>
          <div class="label" data-fit-max="72" data-fit-min="44"><span data-list-text data-words></span></div>
        </div>
      </template>
    </div>
    <div id="marker"><div class="pill"></div><div class="body"></div><div class="eye"></div><div class="chev"></div></div>
  </div>
  <h1 id="headline" class="display fit" data-text-role="headline" data-beat-text="headline" data-fit-max="156" data-fit-min="96"></h1>
  <div id="brand" class="display" data-fit-max="64" data-fit-min="40"><span data-text-role="brand" data-beat-text="brand"></span></div>
  <div id="cta" class="display" data-fit-max="60" data-fit-min="36"><span data-text-role="cta" data-beat-text="cta"></span></div>
</div>
<script>__BASE_JS__</script>
<script>__BEAT_JS__</script>
<script>
(function boot() {
  // GSAP must exist before the timeline is built; if it is not ready yet, build on window load.
  if (!window.gsap) {
    window.addEventListener('load', boot, {once: true});
    return;
  }
  const tl = gsap.timeline({paused: true});
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
    const $ = (s) => document.querySelector(s);
    const beat = m.at(1);
    const cb = (id) => m.score.cues.find((c) => c.id === id).beat;
    const IN = 130;
    const OUT = -130;
    const BIG = 2.5;   // roundel scale at the destination: 56 px -> 140 px
    const ARROW = 2.4; // chevron scale inside the big roundel

    const marker = $('#marker');
    const live = $('#live');
    const pill = $('#marker .pill');
    const body = $('#marker .body');
    const eye = $('#marker .eye');
    const chev = $('#marker .chev');
    const capO = $('#capO i');
    const capD = $('#capD i');

    // Route geometry: the same path drives the line and the marker.
    const L = live.getTotalLength();
    const TOP = 340;                         // origin terminus y
    const RUN0 = 510 + 80 * Math.SQRT2;      // trunk plus the 45 degree bend: start of the bottom run
    const n = Math.max(1, m.items.length);
    const rh = Math.min(480 / n, 160);       // matches #rows --rh
    const y0 = 400 + (480 - rh * n) / 2;     // matches #rows --y0
    const stopY = (i) => y0 + rh * i + rh / 2;
    const stopD = (i) => stopY(i) - TOP;

    live.style.strokeDasharray = L + ' ' + L;
    gsap.set(marker, {'--d': 0});
    gsap.set(live, {strokeDashoffset: L});
    gsap.set(pill, {'--pw': 860});
    gsap.set([body, eye], {scale: 1});
    gsap.set(chev, {rotation: 45, scale: 0});
    gsap.set(capO, {scaleX: 0});
    gsap.set(capD, {scaleY: 0});

    // The marker and the drawn line move together; the line is the marker's trail.
    const move = (b, d, beats = 0.6, ease = 'expo.out') => {
      tl.to(marker, {'--d': d, duration: beats * beat, ease}, m.at(b));
      tl.to(live, {strokeDashoffset: L - d, duration: beats * beat, ease}, m.at(b));
    };
    // One hop per beat from `first` to `last`, ending at d1.
    const hops = (first, last, d0, d1) => {
      const k = Math.max(1, Math.round(last - first) + 1);
      for (let j = 1; j <= k; j++) {
        const b = k > 1 ? first + (j - 1) * (last - first) / (k - 1) : last;
        move(b, d0 + (d1 - d0) * j / k);
      }
    };

    // Beat 0: origin terminus, brand.
    const brand = m.spans($('#brand'));
    const head = m.spans($('#headline'));
    const cta = m.spans($('#cta'));
    gsap.set([...brand, ...head, ...cta], {yPercent: IN});
    gsap.set(head, {'--hot': 0});
    tl.to(brand, {yPercent: 0, duration: 0.8 * beat, ease: 'power3.out', stagger: beat / 8}, m.cue('brand'));
    tl.to(capO, {scaleX: 1, duration: 0.5 * beat, ease: 'expo.out'}, m.cue('brand'));

    // Beat 1: headline.
    tl.to(head, {yPercent: 0, duration: 0.9 * beat, ease: 'expo.out', stagger: beat / 4}, m.cue('headline'));

    // Beat 2: scaffold stops, one per step, on each row's center.
    const stops = m.parts($('#stops'), 'stop', (item) => {
      const el = document.createElement('div');
      el.className = 'stop';
      el.dataset.listGroup = 'scaffold';
      el.dataset.listAlign = 'y';
      el.style.top = (stopY(item.index) - 42) + 'px';
      return el;
    });
    gsap.set(stops, {scale: 0});
    stops.forEach((el, i) => tl.to(el, {scale: 1, duration: 0.5 * beat, ease: 'back.out(1.2)'}, m.cue('scaffold') + i * beat / 8));

    // Beats 3-13: the marker hops station to station, then round the bend.
    let d = 0;
    let b = cb('depart');
    m.plan.items.forEach((it, i) => {
      hops(b, it.start, d, stopD(i));
      d = stopD(i);
      b = it.start + 1;
    });
    hops(b, cb('platform'), d, RUN0);

    // Station labels land on arrival; the stop stamps its number as the marker leaves.
    const fills = [];
    const labels = [];
    m.items.forEach((item, i) => {
      const row = m.row(item.index);
      if (!row) return;
      const words = m.spans(row.querySelector('[data-list-text]'));
      const fill = row.querySelector('.fill');
      const seal = row.querySelector('.seal');
      gsap.set(words, {yPercent: IN});
      gsap.set([fill, seal], {scale: 0});
      tl.to(words, {yPercent: 0, duration: 0.7 * beat, ease: 'power3.out', stagger: beat / 8}, item.start);
      tl.to(fill, {scale: 1, duration: 0.5 * beat, ease: 'back.out(1.2)'}, item.accent);
      tl.to(seal, {scale: 1, duration: 0.5 * beat, ease: 'power3.out'}, m.cue('live') + i * beat / 8);
      fills.push(fill);
      labels.push(words);
    });

    // Beat 14: launch hop onto the bottom run.
    move(cb('launch'), RUN0 + 200, 0.6, 'expo.out');
    // Beat 15: destination lights, the marker accelerates to land on beat 16.
    tl.to(capD, {scaleY: 1, duration: 0.5 * beat, ease: 'expo.out'}, m.cue('signal'));
    move(cb('signal'), L, cb('arrive') - cb('signal'), 'power2.in');

    // Beat 16: arrival stamps the marker out into the CTA nameplate.
    const arrive = m.cue('arrive');
    tl.to(pill, {'--pw': 0, duration: 0.6 * beat, ease: 'expo.out'}, arrive);
    tl.to(body, {scale: 1.3, duration: 0.15 * beat, ease: 'power2.out'}, arrive);
    tl.to(body, {scale: 1, duration: 0.45 * beat, ease: 'back.out(1.2)'}, arrive + 0.15 * beat);

    // Beat 17: CTA.
    tl.to(cta, {yPercent: 0, duration: 0.8 * beat, ease: 'expo.out', stagger: beat / 4}, m.cue('cta'));

    // Beat 19: the roundel swells at the nameplate's head and its eye becomes a go-arrow.
    const beacon = m.cue('beacon');
    tl.to(eye, {scale: 0, duration: 0.2 * beat, ease: 'power3.in'}, beacon);
    tl.to(body, {scale: BIG, duration: 0.6 * beat, ease: 'back.out(1.2)'}, beacon);
    tl.to(chev, {scale: ARROW, duration: 0.5 * beat, ease: 'back.out(1.2)'}, beacon + 0.125 * beat);

    // Beat 20: the destination word lights in the headline, the roundel pops.
    const settle = m.cue('settle');
    const last = head[head.length - 1];
    if (last) tl.set(last, {'--hot': 1}, settle);
    tl.to(body, {scale: BIG * 1.12, duration: 0.15 * beat, ease: 'power2.out'}, settle);
    tl.to(body, {scale: BIG, duration: 0.45 * beat, ease: 'back.out(1.2)'}, settle + 0.15 * beat);

    // Beat 21: clear the text, fold the nameplate back into the marker, shrink the roundel to a dot.
    const clear = m.cue('clear');
    tl.to(head, {yPercent: OUT, duration: 0.4 * beat, ease: 'power3.in', stagger: beat / 16}, clear);
    tl.to(cta, {yPercent: OUT, duration: 0.3 * beat, ease: 'power3.in', stagger: beat / 16}, clear);
    labels.forEach((w, i) => tl.to(w, {yPercent: OUT, duration: 0.4 * beat, ease: 'power3.in', stagger: beat / 16}, clear + i * beat / 16));
    tl.to(pill, {'--pw': 860, duration: 0.55 * beat, ease: 'power3.in'}, clear + 0.375 * beat);
    tl.to(body, {scale: 1, duration: 0.5 * beat, ease: 'power3.inOut'}, clear + 0.375 * beat);
    tl.to(chev, {scale: 1, duration: 0.5 * beat, ease: 'power3.inOut'}, clear + 0.375 * beat);

    // Beat 22: rewind. The arrow returns to the eye; the marker pulls the line home; stops pop out bottom to top.
    const rewind = m.cue('rewind');
    if (last) tl.set(last, {'--hot': 0}, rewind);
    tl.to(chev, {scale: 0, duration: 0.25 * beat, ease: 'power3.in'}, rewind);
    tl.to(eye, {scale: 1, duration: 0.35 * beat, ease: 'power3.out'}, rewind + 0.25 * beat);
    tl.to(marker, {'--d': 0, duration: 1.5 * beat, ease: 'expo.inOut'}, rewind);
    tl.to(live, {strokeDashoffset: L, duration: 1.5 * beat, ease: 'expo.inOut'}, rewind);
    tl.to(capD, {scaleY: 0, duration: 0.4 * beat, ease: 'power3.in'}, rewind);
    fills.forEach((fill, i) => {
      const at = rewind + (fills.length - 1 - i) * beat / 8;
      tl.to([fill, stops[i]].filter(Boolean), {scale: 0, duration: 0.35 * beat, ease: 'power3.in'}, at);
    });

    // Beat 23: brand out, origin bar unlights as the marker parks.
    const home = m.cue('home');
    tl.to(brand, {yPercent: OUT, duration: 0.4 * beat, ease: 'power3.in', stagger: beat / 16}, home);
    tl.to(capO, {scaleX: 0, duration: 0.3 * beat, ease: 'power3.in'}, home + 0.5 * beat);
  });
})();
</script>
</body>
</html>
