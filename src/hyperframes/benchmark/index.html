<!doctype html>
<html lang="en" data-composition-variables='[]'>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="__ASSET_BASE__/gsap.min.js"></script>
  <style>
    __BASE_CSS__
    :root { --w: 1920px; --h: 1080px; }
    .wmask { display:inline-block; overflow:hidden; vertical-align:top; padding:0 .04em .08em; margin-bottom:-.08em; }
    .w { display:inline-block; vertical-align:top; }

    .s1 { background:var(--theme-background); }
    .bmark { position:absolute; left:120px; top:100px; width:28px; height:28px; background:var(--theme-accent); transform-origin:50% 50%; }
    .brand { position:absolute; left:172px; top:88px; width:760px; height:52px; font-size:44px; line-height:52px; white-space:nowrap; overflow:hidden; }
    .s1 .brand { color:var(--theme-foreground); }
    .headline { position:absolute; left:120px; top:340px; width:1680px; height:400px; font-size:200px; line-height:.92; align-content:end; color:var(--theme-foreground); transform-origin:0% 100%; }

    /* The axis sits at its final chart position; transforms carry it from the title rule. */
    .axis { position:absolute; left:600px; top:860px; width:940px; height:4px; }
    .rule { position:absolute; inset:0; background:var(--theme-foreground); transform-origin:0 50%; }
    .tk { position:absolute; top:4px; width:6px; margin-left:-3px; height:32px; background:var(--theme-accent2); transform-origin:50% 0; }
    .gl { position:absolute; bottom:0; width:2px; margin-left:-1px; height:500px; background:color-mix(in srgb, var(--theme-accent2) 28%, transparent); transform-origin:50% 100%; }
    .mark { position:absolute; top:44px; width:10px; margin-left:-5px; height:24px; background:var(--theme-accent2); transform-origin:50% 0; }
    .mark.lead { background:var(--theme-accent); }

    .mrule { position:absolute; left:120px; top:952px; width:8px; height:48px; background:var(--theme-accent); transform-origin:50% 100%; }
    .subhead { position:absolute; left:152px; top:948px; width:1648px; height:56px; font-size:40px; line-height:56px; color:var(--theme-accent2); }

    .chip { position:absolute; left:0; top:0; width:0; height:0; background:var(--theme-accent); transform-origin:0 50%; z-index:1; }
    .rows { position:absolute; left:120px; top:380px; width:1680px; height:460px; display:flex; flex-direction:column; justify-content:center; gap:24px;
      --rh: min(240px, calc((460px - (var(--count, 4) - 1) * 24px) / var(--count, 4)));
      --bh: calc(var(--rh) * .6); }
    .row { position:relative; flex:none; height:var(--rh); }
    .track { position:absolute; left:480px; width:940px; top:calc(50% - var(--bh) / 2); height:var(--bh); background:var(--theme-surface); transform-origin:0 50%; }
    .bar { position:absolute; left:480px; width:calc(var(--f, 1) * 940px); top:calc(50% - var(--bh) / 2); height:var(--bh); background:var(--theme-accent2); transform-origin:0 50%; }
    .pip { position:absolute; left:0; width:12px; top:calc(50% - var(--bh) / 2); height:var(--bh); background:var(--theme-accent2); transform-origin:50% 50%; }
    [data-list] > .row:first-of-type .bar, [data-list] > .row:first-of-type .pip { background:var(--theme-accent); }
    .txt { position:absolute; inset:0; z-index:2; }
    .lab { position:absolute; left:36px; top:calc(50% - 42px); width:420px; height:84px; line-height:84px; font-size:56px; white-space:nowrap; overflow:hidden; color:var(--theme-foreground); }
    .val { position:absolute; left:calc(480px + var(--f, 1) * 940px + 24px); top:calc(50% - 52px); width:236px; height:104px; line-height:104px; font-size:72px; font-weight:700; white-space:nowrap; overflow:hidden; color:var(--theme-foreground); }
    [data-list] > .row:first-of-type .lab, [data-list] > .row:first-of-type .val { color:var(--theme-accent); }
    .li, .vi { display:inline-block; vertical-align:top; }
    .finish { position:absolute; top:360px; left:600px; width:4px; margin-left:-2px; height:500px; background:var(--theme-accent); transform-origin:50% 100%; }

    .s2 { background:var(--theme-accent); color:var(--theme-background); visibility:hidden; clip-path:inset(50% 50% 50% 50%); }
    .s2 .brand { color:var(--theme-background); }
    .s2 .bmark { background:var(--theme-background); }
    .cta { position:absolute; left:120px; top:250px; width:1240px; height:480px; font-size:180px; line-height:.92; align-content:center; color:var(--theme-background); }
    .tile { position:absolute; left:1420px; top:300px; width:380px; height:380px; background:var(--theme-background); overflow:hidden; transform-origin:50% 50%; }
    .arrow { position:absolute; inset:0; }
    .shaft { position:absolute; left:76px; top:176px; width:203px; height:28px; background:var(--theme-accent); }
    .head { position:absolute; left:160px; top:133px; width:114px; height:114px; border-top:28px solid var(--theme-accent); border-right:28px solid var(--theme-accent); transform:rotate(45deg); }
    .axis2 { position:absolute; left:120px; top:880px; width:1680px; height:8px; }
    .rule2 { position:absolute; inset:0; background:var(--theme-background); transform-origin:0 50%; }
    .echo { position:absolute; left:0; bottom:8px; width:30%; height:32px; background:var(--theme-background); transform-origin:0 100%; }
    .tk2 { position:absolute; top:8px; width:12px; margin-left:-6px; height:72px; background:var(--theme-background); transform-origin:50% 0; }

    .wipe { position:absolute; inset:0; background:var(--theme-background); visibility:hidden; clip-path:inset(50% 50% 50% 50%); z-index:5; }
    .chrome { position:absolute; inset:0; z-index:6; pointer-events:none; }
    .cm { position:absolute; width:32px; height:32px; border:0 solid var(--theme-accent2); }
    .cm.a { left:48px; top:48px; border-top-width:2px; border-left-width:2px; }
    .cm.b { right:48px; top:48px; border-top-width:2px; border-right-width:2px; }
    .cm.c { left:48px; bottom:48px; border-bottom-width:2px; border-left-width:2px; }
    .cm.d { right:48px; bottom:48px; border-bottom-width:2px; border-right-width:2px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
    <section id="benchmark-chart" class="scene s1 clip" data-start="0" data-duration="10" data-track-index="0">
      <div class="bmark"></div>
      <div class="brand mono" data-text-role="brand" data-beat-text="brand">Brand</div>
      <h1 class="headline display fit" data-fit-max="200" data-fit-min="120" data-text-role="headline" data-beat-text="headline">Headline</h1>
      <div class="axis">
        <div class="gl" data-p="0" style="left:0%"></div><div class="gl" data-p="0.25" style="left:25%"></div><div class="gl" data-p="0.5" style="left:50%"></div><div class="gl" data-p="0.75" style="left:75%"></div><div class="gl" data-p="1" style="left:100%"></div>
        <div class="tk" data-p="0" style="left:0%"></div><div class="tk" data-p="0.25" style="left:25%"></div><div class="tk" data-p="0.5" style="left:50%"></div><div class="tk" data-p="0.75" style="left:75%"></div><div class="tk" data-p="1" style="left:100%"></div>
        <div class="rule"></div>
      </div>
      <div class="mrule"></div>
      <p class="subhead mono fit" data-fit-max="40" data-fit-min="30" data-text-role="subhead" data-beat-text="subhead">Subhead</p>
      <div class="chip"></div>
      <div class="rows" data-list>
        <template data-list-row>
          <div class="row">
            <div class="track" data-list-part="track" data-list-group="scaffold"></div>
            <div class="bar" data-list-part="bar"></div>
            <div class="pip" data-list-part="pip"></div>
            <div class="txt mono" data-list-text>Item</div>
          </div>
        </template>
      </div>
      <div class="finish"></div>
    </section>
    <section id="benchmark-end" class="scene s2 clip" data-start="0" data-duration="10" data-track-index="1">
      <div class="bmark"></div>
      <div class="brand mono" data-text-role="brand" data-beat-text="brand">Brand</div>
      <h2 class="cta display fit" data-fit-max="180" data-fit-min="96" data-text-role="cta" data-beat-text="cta">CTA</h2>
      <div class="tile"><div class="arrow"><div class="shaft"></div><div class="head"></div></div></div>
      <div class="axis2">
        <div class="echo"></div>
        <div class="tk2" style="left:0%"></div><div class="tk2" style="left:25%"></div><div class="tk2" style="left:50%"></div><div class="tk2" style="left:75%"></div><div class="tk2" style="left:100%"></div>
        <div class="rule2"></div>
      </div>
    </section>
    <div class="wipe"></div>
    <div class="chrome"><div class="cm a"></div><div class="cm b"></div><div class="cm c"></div><div class="cm d"></div></div>
  </div>
  <script>__BASE_JS__</script>
  <script>__BEAT_JS__</script>
  <script>
    const tl = gsap.timeline({paused: true});
    CliphouseBeat.mount(tl, __SCORE__, (tl, m) => {
      const B = (n) => m.at(n);
      const t = (id) => m.cue(id);
      const q = (s) => document.querySelector(s);
      const qa = (s) => [...document.querySelectorAll(s)];
      const root = q('#root');
      const X = 'expo.out';
      const words = (el, start, cap = 2, step = 0.5) => m.spans(el).forEach((w, i) =>
        tl.fromTo(w, {yPercent: 120}, {yPercent: 0, duration: B(0.75), ease: X}, start + Math.min(i, cap) * B(step)));
      const pos = (el) => { let x = 0, y = 0; for (let n = el; n && n !== root; n = n.offsetParent) { x += n.offsetLeft; y += n.offsetTop; } return {x, y}; };
      const make = (tag, cls, txt) => { const e = document.createElement(tag); e.className = cls; if (txt != null) e.textContent = txt; return e; };
      const rect = (x, y, w, h) => `inset(${y}px ${1920 - x - w}px ${1080 - y - h}px ${x}px)`;

      // The title rule (x 120, y 800, 1680 wide) becomes the value axis (x 600, y 860, 940 wide), all by transforms.
      const A0 = {x: 120, y: 800, w: 1680};
      const A1 = {x: 600, y: 860, w: 940};
      const S = A0.w / A1.w;

      // Parse "Label 42" items and size every bar against the largest value.
      const RX = /^(.*\S)\s+(-?\d+(?:\.\d+)?)([%kKmMbB]?)$/;
      const UNIT = {k: 1e3, m: 1e6, b: 1e9};
      const data = m.items.map((it) => {
        const x = it.text.match(RX);
        return x ? {label: x[1], display: x[2] + x[3], value: Math.abs(Number(x[2]) * (UNIT[x[3].toLowerCase()] || 1))}
                 : {label: it.text, display: '', value: 0};
      });
      const top = Math.max(0, ...data.map((d) => d.value)) || 1;
      const F = data.map((d) => Math.max(0.02, d.value / top));
      const n = m.items.length;
      const LAB = n >= 4 ? 52 : n === 3 ? 60 : 72;
      const VAL = n >= 4 ? 64 : n === 3 ? 76 : 96;

      // Split each row's real text into a masked label and a masked value at the bar end. Type scales with the count.
      m.items.forEach((it, i) => {
        const r = m.row(it.index);
        r.style.setProperty('--f', F[i].toFixed(4));
        const txt = r.querySelector('[data-list-text]');
        txt.textContent = '';
        const lab = make('span', 'lab'); lab.dataset.fitMax = String(LAB); lab.dataset.fitMin = '30'; lab.append(make('span', 'li', data[i].label));
        const val = make('span', 'val'); val.dataset.fitMax = String(VAL); val.dataset.fitMin = '36'; val.append(make('span', 'vi', data[i].display));
        txt.append(lab, ' ', val);
      });
      window.cliphouseFitText && window.cliphouseFitText();
      q('.finish').style.left = (600 + F[0] * 940) + 'px';
      q('.echo').style.width = (F[0] * 100) + '%';

      // The axis starts on the title rule: offset container, stretched rule, offset ticks and gridlines.
      const spread = (el) => Number(el.dataset.p) * (A0.w - A1.w);
      tl.fromTo('.axis', {x: A0.x - A1.x, y: A0.y - A1.y}, {x: 0, y: 0, duration: B(1), ease: X}, t('title'));
      qa('.axis .tk, .axis .gl').forEach((el) => tl.fromTo(el, {x: spread(el)}, {x: 0, duration: B(1), ease: X}, t('title')));

      // Beats 0-2: the rule draws, the claim rises, the brand lands.
      tl.fromTo('.rule', {scaleX: 0}, {scaleX: S, duration: B(1), ease: X}, t('rule'));
      words(q('.s1 .headline'), t('headline'));
      words(q('.s1 .brand'), t('brand'));
      tl.fromTo('.s1 .bmark', {scale: 0}, {scale: 1, duration: B(0.75), ease: X}, t('brand'));

      // Beat 3: the claim's lead word cuts to the accent while ticks drop from the rule.
      const lead = m.spans(q('.s1 .headline'))[0];
      if (lead) tl.set(lead, {color: 'var(--theme-accent)'}, t('ticks'));
      qa('.axis .tk').forEach((k, i) => tl.fromTo(k, {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: X}, t('ticks') + i * B(0.125)));

      // Beat 4: the claim becomes the chart title; the rule contracts into the value axis.
      tl.to('.s1 .headline', {y: -390, scale: 0.48, duration: B(1), ease: X}, t('title'));
      tl.to('.rule', {scaleX: 1, duration: B(1), ease: X}, t('title'));

      // Beat 4.5: gridlines grow from the axis, tracks extend as scaffold.
      qa('.axis .gl').forEach((g) => tl.fromTo(g, {scaleY: 0}, {scaleY: 1, duration: B(1), ease: X}, t('grid')));
      m.items.forEach((it) => tl.fromTo(m.row(it.index).querySelector('.track'), {scaleX: 0}, {scaleX: 1, duration: B(1), ease: X}, t('grid') + it.index * B(0.125)));

      // Items: label at start, bar races to its value, value and axis marker land on the accent.
      const marks = m.parts(q('.axis'), 'mark', (it) => {
        const d = make('div', it.index === 0 ? 'mark lead' : 'mark');
        d.style.left = (F[it.index] * 100) + '%';
        return d;
      });
      m.items.forEach((it, i) => {
        const r = m.row(it.index);
        tl.fromTo(r.querySelector('.pip'), {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: X}, it.start);
        tl.fromTo(r.querySelector('.li'), {yPercent: 110}, {yPercent: 0, duration: B(0.75), ease: X}, it.start);
        tl.fromTo(r.querySelector('.bar'), {scaleX: 0}, {scaleX: 1, duration: it.accent - it.start, ease: 'power3.out'}, it.start);
        tl.fromTo(r.querySelector('.vi'), {yPercent: 110}, {yPercent: 0, duration: B(0.5), ease: X}, it.accent);
        tl.fromTo(marks[i], {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: X}, it.accent);
      });

      // Beat 8: the method caption rises under the axis with its marker.
      tl.fromTo('.mrule', {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: X}, t('subhead'));
      words(q('.s1 .subhead'), t('subhead'), 3, 0.125);

      // Beat 9: the finish line. Beat 10: product focus. Beat 11: the value chip.
      tl.fromTo('.finish', {scaleY: 0}, {scaleY: 1, duration: B(0.75), ease: X}, t('finish'));
      const row0 = m.row(0);
      const bar0 = row0.querySelector('.bar');
      tl.to(bar0, {scaleY: 1.3, duration: B(0.75), ease: X}, t('focus'));
      m.items.slice(1).forEach((it) => tl.to(m.row(it.index).querySelector('.bar'), {opacity: 0.35, duration: B(0.5), ease: 'power3.out'}, t('focus')));
      const vi = row0.querySelector('.vi');
      const vbox = row0.querySelector('.val');
      const vp = pos(vbox);
      const fs = parseFloat(getComputedStyle(vbox).fontSize) || VAL;
      const chipH = fs * 1.15;
      const chip = q('.chip');
      chip.style.left = (vp.x - fs * 0.2) + 'px';
      chip.style.top = (vp.y + (vbox.offsetHeight - chipH) / 2) + 'px';
      chip.style.width = (vi.offsetWidth + fs * 0.4) + 'px';
      chip.style.height = chipH + 'px';
      tl.fromTo(chip, {scaleX: 0}, {scaleX: 1, duration: B(0.5), ease: X}, t('chip'));
      tl.set(vi, {color: 'var(--theme-background)'}, t('chip') + B(0.125));

      // Beat 12: the product bar floods the frame in 10 frames.
      const p = pos(bar0);
      const bw = bar0.offsetWidth, bh = bar0.offsetHeight * 1.3;
      const by = p.y + bar0.offsetHeight / 2 - bh / 2;
      tl.set('.s2', {visibility: 'visible', clipPath: rect(p.x, by, bw, bh)}, t('flood'));
      tl.to('.s2', {clipPath: 'inset(0px 0px 0px 0px)', duration: B(2 / 3), ease: 'power3.out'}, t('flood'));
      tl.set('.s1', {visibility: 'hidden'}, t('brandEnd'));

      // Beat 12.5: the brand and the rule return on the field. Beats 13-14: CTA and stamp.
      words(q('.s2 .brand'), t('brandEnd'));
      tl.fromTo('.s2 .bmark', {scale: 0}, {scale: 1, duration: B(0.75), ease: X}, t('brandEnd'));
      tl.fromTo('.rule2', {scaleX: 0}, {scaleX: 1, duration: B(1), ease: X}, t('brandEnd'));
      words(q('.s2 .cta'), t('cta'), 1);
      tl.fromTo('.tile', {clipPath: 'inset(50% 50% 50% 50%)'}, {clipPath: 'inset(0% 0% 0% 0%)', duration: B(0.25), ease: 'power3.out'}, t('stamp'));
      tl.fromTo('.tile', {scale: 1.25}, {scale: 1, duration: B(0.75), ease: X}, t('stamp'));
      tl.fromTo('.arrow', {x: -300}, {x: 0, duration: B(0.75), ease: X}, t('stamp'));

      // Beat 15: the product's measurement redraws on the rule.
      tl.fromTo('.echo', {scaleX: 0}, {scaleX: 1, duration: B(0.75), ease: X}, t('echo'));
      // Beat 16: the measurement steps up into a thick slab while heavy ticks drop from the rule.
      tl.fromTo('.echo', {scaleY: 1}, {scaleY: 2.25, duration: B(0.5), ease: X, immediateRender: false}, t('endTicks'));
      qa('.tk2').forEach((k, i) => tl.fromTo(k, {scaleY: 0}, {scaleY: 1, duration: B(0.5), ease: X}, t('endTicks') + i * B(0.0625)));
      // Beat 17: the arrow nudges.
      tl.to('.arrow', {x: 28, duration: B(0.75), ease: X}, t('nudge'));

      // Beat 18: the scale clears toward the arrow.
      tl.to('.rule2', {scaleX: 0, transformOrigin: '100% 50%', duration: B(0.75), ease: X}, t('clear'));
      tl.to('.echo', {scaleX: 0, transformOrigin: '100% 100%', duration: B(0.75), ease: X}, t('clear'));
      qa('.tk2').forEach((k, i) => tl.to(k, {scaleY: 0, duration: B(0.5), ease: X}, t('clear') + i * B(0.0625)));

      // Beat 19: the dark tile floods back to the empty first frame.
      const tile = q('.tile');
      const tp = pos(tile);
      tl.set('.wipe', {visibility: 'visible', clipPath: rect(tp.x, tp.y, tile.offsetWidth, tile.offsetHeight)}, t('loop'));
      tl.to('.wipe', {clipPath: 'inset(0px 0px 0px 0px)', duration: B(2 / 3), ease: 'power3.out'}, t('loop'));
    });
    window.__timelines = window.__timelines || {};
    window.__timelines.main = tl;
  </script>
</body>
</html>
